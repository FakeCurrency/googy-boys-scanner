[pytest]
testpaths = tests phasemap/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    risk: risk-management, position-sizing and loss-guard rules
    journal: journal P&L and categorization
    slow: replay-heavy (seconds each); CI runs them, locally `-m "not slow"` skips them
