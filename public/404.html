  <style>
    /* #90: styled 404 in the app's language — a centred card, brand glyph,
       and one clear way back. Uses the shared tokens so it can't drift. */
    .nf-wrap {
      min-height: 62vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 18px; padding: 40px 20px;
    }
    .nf-glyph {
      width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center;
      background: var(--panel); border: 1px solid var(--border); color: var(--green);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .nf-code { font: 800 13px/1 var(--mono); letter-spacing: .18em; color: var(--muted); }
    .nf-title { font: 800 26px/1.15 var(--sans); letter-spacing: -0.01em; color: var(--text); margin: 0; }
    .nf-sub { font: 500 14.5px/1.6 var(--sans); color: var(--text-2); max-width: 460px; margin: 0; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
    .nf-btn {
      display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
      padding: 10px 16px; border-radius: 999px; font: 700 12.5px/1 var(--sans); letter-spacing: .02em;
      border: 1px solid var(--border); background: var(--fill); color: var(--text); transition: border-color .15s, background .15s;
    }
    .nf-btn:hover { border-color: var(--green); }
    .nf-btn.primary { background: var(--green-soft); color: var(--green); border-color: color-mix(in srgb, var(--green) 34%, transparent); }
  </style>
</head>
<body>
  <header class="topbar deck-top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 7-8" /><path d="M16 4h4v4" /></svg>
      </span>
      <div class="brand-text"><h1>VIVEK 5.0</h1><span class="brand-sub">BETA SCANNER</span></div>
    </div>
    <div class="nav-pills" id="site-nav"></div>
  </header>

  <main class="wrap">
    <section class="nf-wrap">
      <span class="nf-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 7-8" /><path d="M16 4h4v4" /></svg>
      </span>
      <span class="nf-code">404 · NOT FOUND</span>
      <h2 class="nf-title">This page isn't on the scanner</h2>
      <p class="nf-sub">The link may be old, or a setup that has since ended. Everything live is one tap away from the dashboard.</p>
      <div class="nf-actions">
        <a class="nf-btn primary" href="index.html">← Back to the scanner</a>
        <a class="nf-btn" href="phasemap.html">PhaseMap</a>
        <a class="nf-btn" href="journal.html">Journal</a>
      </div>
    </section>
  </main>
</body>
</html>
