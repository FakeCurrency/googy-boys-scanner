<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vivek 5.0 — ASX, NASDAQ &amp; Crypto</title>
  <meta name="description" content="Vivek 5.0 — 200-SMA reaction scanner for ASX, NASDAQ and Crypto." />
  <meta name="theme-color" content="#10141b" />
  <script src="js/telemetry.js?v=1"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vivek 5.0" />
  <link rel="preload" as="font" type="font/woff2" href="fonts/inter-600.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/inter-800.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/inter-500.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/jbmono-600.woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css?v=2" />
  <link rel="stylesheet" href="css/styles.css?v=96" />
  <script>
  /* Head-start fetch of the active market's scan JSON (UI Wave 1) — reads the
     saved market from gbs:prefs and starts the request before any script
     parses. app.js consumes window.__scanPreload, so nothing loads twice. */
  try {
    var _pm = "asx";
    try { _pm = (JSON.parse(localStorage.getItem("gbs:prefs") || "{}").market) || "asx"; } catch (_e) {}
    // Deep link (#16): ?m= wins over the saved pref so the head-start fetch
    // preloads the market the link asked for, not the last-used one.
    try { var _qm = new URLSearchParams(location.search).get("m"); if (_qm) _pm = _qm.toLowerCase(); } catch (_e2) {}
    if (["asx", "nasdaq", "crypto"].indexOf(_pm) < 0) _pm = "asx";
    window.__scanPreload = {
      market: _pm,
      promise: fetch("data/" + _pm + "_vivek.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
    };
  } catch (_e) {}
  </script>
  <script src="js/nav.js?v=11" defer></script>
  <script src="js/sw-register.js?v=3" defer></script>
</head>
<body>
  <!-- #65: one SVG sprite for the icons repeated on every row — the star and
       the expand chevron are <use>d instead of re-emitting their point data
       per row (~15% less list HTML at 200 rows). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ic-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
    <symbol id="ic-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  </svg>
  <!-- Command Deck topbar (Wave 3): ONE row — brand · markets · nav · clocks · actions -->
  <header class="topbar deck-top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-5 4 3 7-8" /><path d="M16 4h4v4" />
        </svg>
      </span>
      <div class="brand-text"><h1>VIVEK 5.0</h1><span class="brand-sub">BETA SCANNER</span></div>
    </div>
    <div class="market-switch" role="tablist" aria-label="Market">
      <button class="market-btn is-active" data-market="asx" role="tab" aria-selected="true">ASX</button>
      <button class="market-btn" data-market="nasdaq" role="tab" aria-selected="false">NASDAQ</button>
      <button class="market-btn" data-market="crypto" role="tab" aria-selected="false">CRYPTO</button>
    </div>
    <!-- shared site nav (js/nav.js) -->
    <div class="nav-pills" id="site-nav"></div>
    <div class="deck-top-right">
      <div class="microclock" id="microclock" title="">
        <span class="mc-major" id="clk-mel-time">—</span>
        <span class="mc-minor" id="clk-china-time">—</span>
        <span class="mc-major" id="clk-ny-time">—</span>
        <span class="mc-minor" id="clk-london-time">—</span>
      </div>
      <button class="search-trigger" id="search-trigger" title="Search results (press /)" aria-label="Search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="search-trigger" id="notify-btn" title="Browser alerts for triple-lens alignments" aria-label="Toggle alignment notifications">🔔</button>
      <button class="reload-btn" id="reload-btn" title="Run a fresh cloud scan" aria-label="Run a fresh scan">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span class="reload-label">SCAN</span>
      </button>
      <span class="refresh-timer" id="refresh-timer" title="Auto-refresh countdown"></span>
    </div>
  </header>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay" hidden role="dialog" aria-modal="true" aria-label="Search results">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search ticker or name…" autocomplete="off" spellcheck="false" />
      <kbd class="search-esc">Esc</kbd>
    </div>
    <button class="search-cancel" id="search-cancel" type="button">Cancel</button>
    <div class="search-results" id="search-results"></div>
  </div>

  <main class="wrap">
    <!-- COMMAND DECK (Wave 3): one bar replaces the scan banner, freshness
         pill placement, 4 stat cards, bot strip and the at-level/confluence
         banner strips — those live on as click-to-filter pills. -->
    <section class="deck" id="deck">
      <div class="deck-status">
        <div class="deck-title" id="scan-title">Loading latest scan…</div>
        <div class="deck-sub">
          <span class="deck-dot" id="deck-dot" aria-hidden="true"></span>
          <span id="scan-sub">Updates automatically after each market close</span>
          <span class="scan-fresh" id="scan-fresh" hidden></span>
        </div>
      </div>
      <div class="deck-pills" id="deck-pills" role="group" aria-label="Scan filters"></div>
      <div class="deck-bot" id="bot-activity" hidden></div>
    </section>

    <!-- PULSE removed 2026-07-03 (owner: unused). The macro data still
         generates server-side; restore this section + the renderPulse call
         guards in app.js to bring it back. -->

    <!-- ONE sticky toolbar (backlog #1-3): grades + ★ watch + VIVEK filter
         chips + a compact cycling sort — a single line that pins under the
         topbar and slims on scroll. Replaces the old view-tabs nav + controls
         row + separate vk-filters strip. -->
    <section class="toolbar" id="toolbar">
      <div class="tb-line">
        <button class="seg-btn tb-views" id="views-btn" type="button" aria-haspopup="true" aria-expanded="false"
          title="Saved views — save or apply a filter+sort combination">☰</button>
        <div class="seg" id="tabs" role="group" aria-label="Grade filter">
          <button class="seg-btn is-active" data-tab="aplus" aria-pressed="true">A+ <span class="seg-count" id="count-aplus">0</span></button>
          <button class="seg-btn" data-tab="a" aria-pressed="false">A <span class="seg-count" id="count-a">0</span></button>
          <button class="seg-btn" data-tab="watch" aria-pressed="false">WATCH <span class="seg-count" id="count-watch">0</span></button>
        </div>
        <button class="seg-btn tb-watch" id="watch-toggle" aria-pressed="false"
          title="Your starred names, from every lens — tap to show only them">★ <span class="seg-count" id="watch-count">0</span></button>
        <button class="seg-btn tb-watch tb-dim is-active" id="fund-dim" aria-pressed="true"
          title="FUND / REIT rows are dimmed — the bot never trades them and most CFD brokers don't list them. Tap to show them at full strength.">⚠ FUNDS</button>
        <div class="tb-chips" id="vk-filters" hidden></div>
        <div class="tb-sort" role="group" aria-label="Sort">
          <button class="tb-sort-label" id="sort-cycle" title="Sort — tap to cycle: SCORE → PRICE → R:R → M.C → A-Z">SCORE</button>
          <button class="tb-sort-dir" id="sort-dir" title="Flip sort direction">↓</button>
        </div>
      </div>
    </section>

    <!-- UX-20 #3: ★ MY NAMES live strip -->
    <section class="watch-strip" id="watch-strip" hidden aria-label="Your starred names"></section>

    <!-- EMA legend -->
    <section class="ema-legend" id="ema-legend"></section>

    <!-- results -->
    <section class="rows" id="results" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p class="footer-quote" id="footer-quote"></p>
    <p class="disclaimer">General information only — not financial advice. Markets carry risk.</p>
    <p class="credit">Vivek 5.0 · data via Yahoo Finance · refreshed daily after each market close</p>
  </footer>

  <script src="js/gbs-sync.js?v=7"></script>
  <script src="js/phasemap-shared.js?v=9"></script>
  <script src="js/cache.js?v=1"></script>
  <script src="js/app.js?v=98"></script>
</body>
</html>
