name: Kill-switch check

# Runs every 30 minutes, ALL hours, ALL days (2026-07-20): the check reads the
# bot book (review C5), and the crypto slice of that book trades 24/7 — the
# old market-hours-only crons (which were also EDT-hardcoded and drifted an
# hour every winter) left crypto unguarded overnight and all weekend.
# Flattens Bybit (or Alpaca) positions only if broker credentials are set;
# with none it logs + alerts and exits cleanly.
on:
  # SCHEDULE RE-REGISTRATION (2026-07-30): the scheduler stopped creating runs
  # for EVERY cron in this repo after ~01:15 UTC — the same window in which
  # GitHub's ref backend was erroring (crypto_bot #255, "fatal error in
  # commit_refs"). This touch re-registers all schedules (2026-07-24 precedent).
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log only — do not flatten positions"
        default: "true"
        required: false

permissions:
  contents: read
  actions: read      # watchdog run-history probes (2026-07-20 Phase 5)

concurrency:
  group: kill-switch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # TOP100 #44 - runs every 30 minutes, so a hung run would still be
    # holding `group: kill-switch` when the next two are due. The check
    # reads journals and probes run history; 15 is generous for that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Watchdog alert-state (first-alert / 6h-reminder / recovery dedup)
      # rides the cache, same prefix-restore pattern as the frame cache —
      # zero commits, zero deploys. .cache/ is gitignored.
      - name: Restore watchdog state
        uses: actions/cache@v4
        with:
          path: .cache/watchdog_state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: Run kill-switch check
        env:
          BYBIT_API_KEY:     ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET:  ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_TESTNET:     ${{ secrets.BYBIT_TESTNET }}
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # ALERT SECRETS ARE LOAD-BEARING HERE (2026-07-28). Without them
          # kill_switch.py:88-94 -> alert_dispatch.send finds every channel
          # unconfigured, all three return False, and the whole thing exits down
          # log.debug("alert skipped") — i.e. THE KILL SWITCH FIRES SILENTLY.
          # The watchdog step below has always exported the full set; this step,
          # the one that can flatten the account, had none of it. Never remove
          # these to "tidy up" the env block.
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GBS_SMTP_HOST:       ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT:       ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER:       ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS:       ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO:        ${{ secrets.GBS_ALERT_TO }}
          # Input passes through env, never ${{ }} inside run: (2026-07-20
          # security pass) — this job holds the broker keys, and the free-text
          # input could otherwise inject shell into it.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # Scheduled runs have no input (DRY_RUN empty) and must stay ARMED —
          # only an explicit dry_run=true from a manual dispatch logs-only.
          if [ "$DRY_RUN" = "true" ]; then
            python -m scanner.broker.kill_switch --dry-run
          else
            python -m scanner.broker.kill_switch
          fi

      # Freshness watchdog (2026-07-20, Phase 5): content + run-history
      # probes for every critical pipeline. Runs AFTER the kill-switch check
      # so it can never block the safety net; its own crash fails this job
      # loudly (a silent monitor is worse than none). See scanner/watchdog.py
      # and OPERATIONS.md "Watchdog alerts".
      - name: Freshness watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_HOST: kill_switch
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GBS_SMTP_HOST: ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT: ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER: ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS: ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO: ${{ secrets.GBS_ALERT_TO }}
        run: python -m scanner.watchdog

      # PIGGYBACK TICK (2026-08-27). GitHub coalesces stop_watcher's 5-minute
      # cron to ~31 starts/day on this repo (observed gaps to 115 min), so
      # every 24/7 workflow now fires one best-effort authed tick — the union
      # of interleaved schedules is what restores the real stop/target
      # cadence. Best-effort BY CONSTRUCTION: stop_watcher owns every tick
      # verdict (503/000/401 taxonomy, summaries, the watchdog handoff); this
      # is only an extra beat, and a dead beat must never redden a
      # kill-switch run. NOT the watchdog's anonymous probe one step up —
      # that one must stay credential-free (test-pinned) so the monitor never
      # moves the thing it monitors; this step exists precisely to move it.
      - name: Fire the paper stop/target tick (best-effort piggyback)
        if: always()
        continue-on-error: true
        env:
          TICK_URL: ${{ vars.TICK_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          [ -z "${TICK_SECRET:-}" ] && { echo "TICK_SECRET not set - skipping."; exit 0; }
          URL="${TICK_URL:-https://googy-boys-scanner.pages.dev/api/tick}"
          code=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TICK_SECRET}" "$URL") || true
          echo "piggyback tick: HTTP ${code:-000} (verdicts belong to stop_watcher.yml)"
