name: Ignition scan

# IGNITION -- the coil -> ignition lens. REPORT-ONLY: it publishes
# public/data/ignition/<market>.json (+ <market>_backtest.json on demand) and
# touches nothing else, ever. v1 screens crypto only (config.IGNITION_MARKETS).
#
# WHEN IT RUNS, AND WHY THAT OFTEN. The signal is judged on COMPLETED daily
# bars, and a crypto bar completes at 00:00 UTC, so the run that matters is
# the first one after midnight UTC (~10-11am Melbourne). GitHub's scheduler
# drops and delays crons (the 2026-09-23 outage; morning_plays' 2-5h lates),
# so that run is backed up twice. The intraday runs are for the two things
# that move INTRADAY (four runs a day): a forming bar that is breaking out right now (published
# as "provisional", never as confirmed -- QNT's own 23 Sep poke above its base
# closed back inside it) and the RUNNING rows' live marks. Every run
# recomputes the whole file from bars, so a late or duplicate run is harmless.
#
# THE BACKTEST is not scheduled: it answers a question, it is not a feed. It
# runs on a manual dispatch with `backtest: true`, OR on a push that touches
# .github/ignition-kick (the dispatch_scan.yml pattern -- a cloud Claude
# session can push but cannot call the dispatch API). A kick runs the screen
# AND the backtest, and commits both files back to the branch that was pushed,
# so a feature branch can be evaluated before anything reaches main.
#
# ITS OWN CONCURRENCY GROUP. It writes no book, so it has no business in the
# `scan` mutex (tests/test_workflow_mutex.py would then demand it in
# close_position.yml's wait-loop watch list).

on:
  schedule:
    - cron: "14 0 * * *"     # just past 00:00 UTC: the new completed crypto bar
    - cron: "14 1,2 * * *"   # scheduler-drop backstops for the run above
    - cron: "44 5,11,17,21 * * *"   # intraday: provisional breaks + RUNNING marks
  push:
    paths:
      - ".github/ignition-kick"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also replay the lens and publish crypto_backtest.json"
        default: false
        required: false
        type: boolean
      dry_run:
        description: "Screen (and replay) and print, publish nothing"
        default: false
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  # One queue PER BRANCH. GitHub keeps one pending run per group and cancels
  # the one already waiting, so a single shared group would let main's next
  # cron evict a feature-branch kick that was queued behind a running cron --
  # the CLAUDE.md #108/#109 eviction. Runs on different branches write
  # different branches, so they never need to exclude each other.
  group: ignition-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ignition:
    runs-on: ubuntu-latest
    # ~200 coins; the 5y screen download is a few minutes, the full-history
    # replay plus its 243-cell grid ~10. Bounded: an unbounded job holds this
    # group for six hours and stalls every later refresh with it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # THE BACKSTOP GATE. The 01:14 / 02:14 crons exist only to cover a
      # dropped 00:14; when today's post-midnight file is already on the
      # branch they stop here, before `pip install`, and commit nothing (every
      # publish re-stamps generated_at, so an un-gated backstop is a pointless
      # commit and a Cloudflare deploy). Read from a FRESH fetch: a run that
      # sat pending was created at an older SHA. Every other trigger is due.
      - name: Is this run due
        id: due
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -u
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] || [ "${SCHEDULE:-}" != "14 1,2 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet --depth=1 origin "${GITHUB_REF_NAME}" || true
          STAMP=$(git show "origin/${GITHUB_REF_NAME}:public/data/ignition/crypto.json" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('generated_at',''))" 2>/dev/null || true)
          TODAY=$(date -u +%Y-%m-%d)
          if [ -n "$STAMP" ] && [ "${STAMP:0:10}" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "backstop: today's file is already published ($STAMP) - nothing to do"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "backstop: no post-midnight file yet (stamp '${STAMP}') - running"
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: pip install -r requirements.txt

      # Its OWN cache namespace, so it can never mix windows with the scan's
      # or the momentum lens's frames, and disappears cleanly with the lens.
      - name: Restore frame cache
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/frames
          key: ignition-frames-${{ github.run_id }}
          restore-keys: |
            ignition-frames-

      # A KICK also measures the data sources side by side (report only, never
      # fails the run): which exchanges answer a US runner, freshness, the
      # close gap to Yahoo, and the liquidity-floor effect of exchange volume.
      - name: Compare crypto data sources
        if: steps.due.outputs.run == 'true' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/crypto_source_compare.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Screen crypto
        id: scan
        if: steps.due.outputs.run == 'true'
        run: |
          set -u
          ARGS="--market crypto"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # THREE OUTCOMES, AND THE EXIT CODE IS WHAT TELLS THEM APART.
          #   0  screened and published
          #   3  deliberately published nothing (download blocked/empty); the
          #      previous file stands -- an empty list over it would say
          #      "nothing is coiling" when the truth is "we could not look"
          #   *  a real failure
          RC=0
          python -m scanner.ignition.run $ARGS || RC=$?
          echo "rc=$RC"
          case "$RC" in
            0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::ignition crypto published nothing - the download came back empty and the previous file was kept. A REPORTED DECISION, not a fault."
              ;;
            *)
              echo "::error::ignition crypto screen failed with exit $RC"
              exit "$RC"
              ;;
          esac

      - name: Backtest crypto
        id: bt
        if: steps.due.outputs.run == 'true' && (github.event_name == 'push' || inputs.backtest == true)
        run: |
          set -u
          set -o pipefail
          ARGS="--market crypto --backtest"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          RC=0
          python -m scanner.ignition.run $ARGS | tee -a "$GITHUB_STEP_SUMMARY" || RC=$?
          case "$RC" in
            0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::ignition backtest had no data - nothing written"
              ;;
            *)
              echo "::error::ignition backtest failed with exit $RC"
              exit "$RC"
              ;;
          esac

      - name: Commit and push
        if: (steps.scan.outputs.published == 'true' || steps.bt.outputs.published == 'true') && inputs.dry_run != true
        env:
          SCAN_PUBLISHED: ${{ steps.scan.outputs.published }}
          BT_PUBLISHED: ${{ steps.bt.outputs.published }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The branch this run belongs to: main for the schedule, the pushed
          # branch for a kick. Never hard-coded, so a feature-branch kick can
          # never write to main.
          BRANCH="${GITHUB_REF_NAME}"

          # ONLY the files this run reported publishing -- and one pathspec per
          # `git add`: `git add a b` is ALL-OR-NOTHING and the repo bans it.
          PATHS=""
          if [ "${SCAN_PUBLISHED:-}" = "true" ]; then PATHS="$PATHS public/data/ignition/crypto.json"; fi
          if [ "${BT_PUBLISHED:-}" = "true" ]; then PATHS="$PATHS public/data/ignition/crypto_backtest.json"; fi
          for p in $PATHS; do
            if [ -e "$p" ]; then
              git add -- "$p"
            else
              # The scanner REPORTED publishing this path; its absence is lost
              # output, not a no-op.
              echo "::error::$p was reported published but is not present"
              exit 1
            fi
          done

          # The must-change gate, ONE CALL PER REPORTED PATH. assert_staged.sh
          # is ANY-OF, so a single call naming both files would pass on the
          # screen alone while the backtest a kick reported publishing was
          # lost (audit, 2026-09-28). Every publish re-stamps generated_at, so
          # a reported path that stages nothing means output was silently
          # dropped (the 2026-07-20 incident).
          for p in $PATHS; do
            bash scripts/assert_staged.sh "ignition $p" "$p"
          done

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: ignition crypto $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)

          # Rebase-and-retry. Only ever REPLACE a path THIS run generated, or a
          # newer copy pushed meanwhile gets deleted.
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for p in $PATHS; do
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs $BRANCH."; exit 0; fi
            git commit -m "data: ignition crypto $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed to $BRANCH."
              exit 0
            fi
            echo "Push race - retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1
