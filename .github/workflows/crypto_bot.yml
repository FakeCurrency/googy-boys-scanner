name: Crypto bot (24/7 paper)

# Crypto trades round the clock, so the VIVEK paper bot scans + manages the
# crypto book every hour, EVERY day — independent of the weekday/stock-hours
# schedule in scan.yml. Stock markets (ASX/NASDAQ) are handled by scan.yml and
# only open positions during their sessions.
#
# Shares the "scan" concurrency group with scan.yml so the two never write the
# shared paper book (journal/vivek_bot_book.json) at the same time.
#
# Paper only: scanner.run maintains the JSON paper book — it places NO real
# orders (no broker is wired). Pushing to main triggers a Cloudflare redeploy.
on:
  schedule:
    - cron: "0 * * * *"        # hourly, all days
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args for scanner.run (e.g. --limit 8 for a quick test)"
        default: ""
        required: false

permissions:
  contents: write
  actions: read      # watchdog run-history probes (2026-07-20 Phase 5)

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore frame cache
        uses: actions/cache@v4
        with:
          path: .cache/frames
          key: vivek-frames-${{ github.run_id }}
          restore-keys: |
            vivek-frames-

      # Watchdog alert-state (dedup) — shared prefix with kill_switch.yml so
      # both hosts see the same first-alert/reminder/recovery history.
      - name: Restore watchdog state
        uses: actions/cache@v4
        with:
          path: .cache/watchdog_state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: Run crypto scan + paper bot
        env:
          # Free-text input via env, never ${{ }} in run: (2026-07-20 security pass)
          ARGS: ${{ github.event.inputs.args }}
        run: python -m scanner.run --market crypto $ARGS

      - name: Verify VIVEK data schema (crypto)
        run: |
          python - <<'PY'
          import json, sys
          from scanner import config
          want = config.VIVEK_SCHEMA_VERSION
          f = "public/data/crypto_vivek.json"
          v = json.load(open(f)).get("schema_version")
          if v != want:
              print(f"SCHEMA GATE FAILED: {f}: schema_version {v} != expected {want}"); sys.exit(1)
          print(f"schema gate OK — {f} at v{want}")
          PY

      # Track-record integrity gate (Phase 4): a malformed / cross-contaminated
      # / stale book fails the run HERE — failure email, nothing committed.
      - name: Verify book integrity
        run: python -m scanner.broker.vivek_run --verify

      - name: Commit & push fresh data (triggers Cloudflare deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SURGICAL paths only (2026-07-20, review C3): exactly what
          # `scanner.run --market crypto` writes — the crypto scan JSON, the
          # sectors/fx/bot_rules files run.py refreshes on every invocation,
          # and both copies of the paper book. The old bare "public/data" made
          # the retry loop below revert OTHER workflows' fresh outputs
          # (phasemap snapshots, spec files, backtest stats) to this run's
          # stale checkout. Invariant: list only files written by scan-group
          # workflows.
          PATHS="public/data/crypto_vivek.json public/data/crypto_prices.json public/data/sectors.json public/data/fx.json public/data/bot_rules.json public/data/vivek_bot_book.json journal/vivek_bot_book.json journal/vivek_bot_book.crypto.json journal/vivek_bot_book.unassigned.json"
          # ONE path per git add (2026-07-20 hotfix): `git add a b missing`
          # stages NOTHING when any single pathspec matches no file. The
          # unassigned book file only exists when migration finds strays, so
          # its absence made every add fail wholesale — green runs, zero
          # commits, frozen site. Per-path adds cannot couple like that.
          for p in $PATHS; do git add -- "$p" 2>/dev/null || true; done
          git diff --cached --stat | tail -5
          # Must-change gate (2026-07-20 Phase 5): every non-dry bot run
          # re-stamps the book's updated_at, so a scheduled run staging
          # NOTHING is always a bug (the Phase 3 staging bug ran green 5x
          # exactly this way). Manual dispatches only warn.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            bash scripts/assert_staged.sh "crypto output" journal/vivek_bot_book.json
          else
            bash scripts/assert_staged.sh "crypto output (manual)" journal/vivek_bot_book.json \
              || echo "::warning::book not staged (manual run - dry-run or test args?)"
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: crypto bot $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)
          # Re-apply OUR files onto the freshest main. Safe because $PATHS is
          # surgical (see above) and scan-group workflows serialize.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              [ -e "$p" ] && git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
              git checkout "$SHA" -- "$p" 2>/dev/null || true
            done
            # The COMBINED book is a DERIVED file shared by every scan-group
            # workflow (2026-07-20 evening incident): a run queued on an OLD
            # checkout that loses the push race re-applies its STALE combined
            # over marks a fresher run just committed (canonical per-market
            # files stay correct; only the derived view diverges until the
            # next run). Regenerate it from the CURRENT tree instead of
            # trusting this run's snapshot.
            python -m scanner.broker.vivek_run --rebuild-combined
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: crypto bot $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1

      # Freshness watchdog (2026-07-20, Phase 5): cross-checks EVERY critical
      # pipeline (incl. kill_switch.yml aliveness, which commits nothing and
      # is otherwise invisible). Second host besides kill_switch.yml so a
      # scheduler skip of one workflow doesn't blind the monitor.
      - name: Freshness watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_HOST: crypto_bot
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GBS_SMTP_HOST: ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT: ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER: ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS: ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO: ${{ secrets.GBS_ALERT_TO }}
        run: python -m scanner.watchdog

      # If anything above failed, say so — otherwise the site quietly serves
      # stale data and nobody notices until the freshness badge goes orange.
      - name: Alert on failure (Discord)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "No webhook configured - skipping."; exit 0; }
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"WARNING: **${{ github.workflow }}** run FAILED - scan data may be going stale. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true
