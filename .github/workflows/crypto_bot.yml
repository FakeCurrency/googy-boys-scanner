name: Crypto bot (24/7 paper)

# Crypto trades round the clock, so the VIVEK paper bot scans + manages the
# crypto book every hour, EVERY day — independent of the weekday/stock-hours
# schedule in scan.yml. Stock markets (ASX/NASDAQ) are handled by scan.yml and
# only open positions during their sessions.
#
# Shares the "scan" concurrency group with scan.yml so the two never write the
# shared paper book (journal/vivek_bot_book.json) at the same time.
#
# Paper only: scanner.run maintains the JSON paper book — it places NO real
# orders (no broker is wired). Pushing to main triggers a Cloudflare redeploy.
on:
  # SCHEDULE RE-REGISTRATION (2026-07-30): the scheduler stopped creating runs
  # for EVERY cron in this repo after ~01:15 UTC — the same window in which
  # GitHub's ref backend was erroring (crypto_bot #255, "fatal error in
  # commit_refs"). This touch re-registers all schedules (2026-07-24 precedent).
  schedule:
    # :22 (2026-07-22): off GitHub's congested :00 slot, and offset from
    # scan.yml's :07 crons so the two never co-arrive at the shared queue.
    #
    # SCHEDULE RE-REGISTRATION (2026-07-24): GitHub's scheduler also dropped
    # this workflow's 23:22 UTC owned-hour run (alongside scan.yml's morning
    # crons — no runs created, nothing failed). Editing the file re-registers
    # the crons; that is this comment's only purpose.
    - cron: "22 * * * *"       # hourly, all days (weekday stock-session hours
                               # skipped by the gate job below — scan.yml owns
                               # crypto during those windows)
    # :52 FRESHNESS BACKSTOP (Fix-10 #8, 2026-07-26): GitHub's scheduler
    # silently dropped four hourly :22 fires in one day — 2-3h crypto gaps
    # that stay under the watchdog's 6h alarm. This slot only exists to catch
    # a dropped fire: the gate probes the LIVE crypto scan's age and SKIPS
    # when data is fresh, so it costs one curl on healthy hours.
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args for scanner.run (e.g. --limit 8 for a quick test)"
        default: ""
        required: false

permissions:
  contents: write
  actions: read      # watchdog run-history probes (2026-07-20 Phase 5)

# NOTE: the "scan" mutex now lives on the `crypto` JOB below, not here at
# workflow level (2026-07-28) — see the long comment there and the matching one
# in scan.yml. Workflow-level grouping put this file's cheap gate job into the
# same one-slot queue as the scans, so the :52 freshness backstop kept being
# cancelled before it could probe, and kept cancelling scan.yml's :47 backstop
# in turn. Do not re-add a workflow-level concurrency block here.

jobs:
  # De-double the queue (2026-07-22): during weekday stock sessions scan.yml's
  # full hourly cycle ALREADY scans crypto and manages the crypto book — a
  # second hourly run in the same serialized "scan" group just displaces queued
  # runs and doubles the Yahoo load (the red-run / failure-email pattern every
  # ASX morning). Scheduled runs therefore skip the scan.yml windows and own
  # the OFF-window hours (07–13 + 22–23 UTC weekdays; all hours on weekends,
  # where scan.yml fires only 4×/day). Manual dispatches always run.
  gate:
    runs-on: ubuntu-latest
    # TOP100 #44 - clock/probe only; see scan.yml's gate.
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          DOW=$(date -u +%u)   # 1=Mon … 6=Sat 7=Sun
          HR=$(date -u +%H)
          # :52 backstop (Fix-10 #8): freshness-gated, fail-open. Deliberately
          # bypasses the weekday window-ownership skip below — if the data is
          # stale, whichever workflow owned the hour has already missed it.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "52 * * * *" ]; then
            AGE=$(curl -sS --max-time 20 "https://googy-boys-scanner.pages.dev/data/crypto_vivek.json" \
              | python3 -c "import json,sys,datetime as dt; j=json.load(sys.stdin); t=dt.datetime.fromisoformat(j['generated_at']); print('fresh' if (dt.datetime.now(dt.timezone.utc)-t).total_seconds()<3900 else 'stale')" \
              2>/dev/null || echo "unknown")
            echo "backstop :52 - live crypto data reads: $AGE"
            if [ "$AGE" = "fresh" ]; then
              echo "Backstop :52 - crypto scanned within 65 min. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Backstop :52 - stale or unreadable ($AGE). Running the missed cycle."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # TOP100 #41 — hour 23 changes owner with daylight saving. The window
          # list below is written in UTC against an AEST (UTC+10) ASX session.
          # Under AEDT (UTC+11) that session starts at 23:00 UTC on the PREVIOUS
          # day, and scan.yml now has 23:07/23:47 crons covering it (Sun–Thu UTC,
          # because Monday's open is Sunday in UTC). Hour 23 is currently one of
          # THIS workflow's owned off-window hours, so without this branch the
          # AEDT open would put a full 3-market scan and a crypto scan into the
          # same one-slot `scan` queue 15 minutes apart — the exact de-doubling
          # this gate was written to prevent, arriving silently in October.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HR" = "23" ]; then
            case "$DOW" in
              7|1|2|3|4)
                OFFSET=$(python3 -c "import datetime as dt;from zoneinfo import ZoneInfo;print(int(dt.datetime.now(ZoneInfo('Australia/Melbourne')).utcoffset().total_seconds()//3600))" 2>/dev/null || echo "")
                if [ "$OFFSET" = "11" ]; then
                  echo "23 UTC on a Melbourne AEDT trading eve — scan.yml owns the ASX open; skipping."
                  echo "run=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "23 UTC, Melbourne offset ${OFFSET:-unknown} — not AEDT, this hour is still ours." ;;
            esac
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" -le 5 ]; then
            case "$HR" in
              0[0-6]|1[4-9]|2[01])
                echo "Weekday scan-window hour ${HR} UTC — scan.yml owns crypto now; skipping."
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  # The "scan" mutex — job-scoped since 2026-07-28 (full rationale in scan.yml,
  # on its `scan` job). Short version: this job is the one that writes the paper
  # book, so this job is what must never run beside scan.yml's. The gate above
  # only curls, so keeping it out of the queue lets it actually reach its probe
  # instead of being cancelled by the next arrival in the group.
  crypto:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # TOP100 #44 - this job holds the `scan` mutex. Without an explicit
    # timeout a hung step (a Yahoo socket that never returns, a push retry
    # loop that never resolves) holds the group for GitHub's 6-hour default,
    # and EVERY close, scan and crypto run queued behind it is evicted -
    # GitHub keeps one pending run per group and cancels the previous one.
    # One stuck run therefore costs a whole session of scans, silently.
    # Sized well above a real cycle (hourly cadence means a healthy run
    # finishes inside the hour) so this fires on a hang, not on a slow day.
    # Crypto is ~100 names against a 24/7 feed - one leg of the 40-80 min
    # 3-market cycle scan.yml documents - so it gets well under the stock
    # budget while still leaving a healthy slow run plenty of room.
    timeout-minutes: 45
    concurrency:
      group: scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore frame cache
        uses: actions/cache@v4
        with:
          path: .cache/frames
          key: vivek-frames-${{ github.run_id }}
          restore-keys: |
            vivek-frames-

      # Watchdog alert-state (dedup) — shared prefix with kill_switch.yml so
      # both hosts see the same first-alert/reminder/recovery history.
      - name: Restore watchdog state
        uses: actions/cache@v4
        with:
          path: .cache/watchdog_state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: Run crypto scan + paper bot
        env:
          # Free-text input via env, never ${{ }} in run: (2026-07-20 security pass)
          ARGS: ${{ github.event.inputs.args }}
          # ALERT SECRETS (2026-07-28). This step used to export ARGS and
          # nothing else, so EVERY alert the 24/7 crypto path can raise was
          # dropped on the floor: the loss-guard breach (vivek_run.py:887-894),
          # the trade_review "your call" push (:550), the mark-sanity anomaly
          # (:372-432) and the book-corrupt alarm (:101-111). Crypto is the one
          # market that trades while nobody is awake, which makes it the one
          # market where a silent alert path is the whole failure.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GBS_SMTP_HOST:       ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT:       ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER:       ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS:       ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO:        ${{ secrets.GBS_ALERT_TO }}
          # What started this run (2026-08-20) — stamped into funnel_history
          # rows as `trigger`. The heartbeat healer dispatches scan.yml, not
          # this file, so here it is only ever cron or manual.
          SCAN_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
        run: python -m scanner.run --market crypto $ARGS

      - name: Verify VIVEK data schema (crypto)
        run: |
          python - <<'PY'
          import json, sys
          from scanner import config
          want = config.VIVEK_SCHEMA_VERSION
          f = "public/data/crypto_vivek.json"
          doc = json.load(open(f))
          if doc.get("schema_version") != want:
              print(f"SCHEMA GATE FAILED: {f}: schema_version {doc.get('schema_version')} != expected {want}"); sys.exit(1)
          # v5 PAIRING CHECK (payload diet): the detail sidecar must exist,
          # parse, match the version AND carry the summary's generated_at —
          # a run that pushes one file and loses the other fails HERE, not
          # as a deck whose row-expand can never load.
          det = f.replace("_vivek.json", "_vivek_detail.json")
          try:
              dd = json.load(open(det))
          except Exception as e:
              print(f"SCHEMA GATE FAILED: {det}: unreadable ({e})"); sys.exit(1)
          if dd.get("schema_version") != want:
              print(f"SCHEMA GATE FAILED: {det}: schema_version {dd.get('schema_version')} != expected {want}"); sys.exit(1)
          if dd.get("generated_at") != doc.get("generated_at"):
              print(f"SCHEMA GATE FAILED: {det}: generated_at {dd.get('generated_at')} != summary {doc.get('generated_at')}"); sys.exit(1)
          print(f"schema gate OK — {f} + detail sidecar paired at v{want}")
          PY

      # Track-record integrity gate (Phase 4): a malformed / cross-contaminated
      # / stale book fails the run HERE — failure email, nothing committed.
      - name: Verify book integrity
        run: python -m scanner.broker.vivek_run --verify

      - name: Commit & push fresh data (triggers Cloudflare deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SURGICAL paths only (2026-07-20, review C3): exactly what
          # `scanner.run --market crypto` writes — the crypto scan JSON, the
          # sectors/fx/bot_rules files run.py refreshes on every invocation,
          # and both copies of the paper book. The old bare "public/data" made
          # the retry loop below revert OTHER workflows' fresh outputs
          # (phasemap snapshots, spec files, backtest stats) to this run's
          # stale checkout. Invariant: list only files written by scan-group
          # workflows.
          # data/scan_health.json joined the list 2026-07-30: the engine
          # updates the crypto dry-run counter on EVERY crypto publish, but
          # only scan.yml staged the file — so the committed counter lagged a
          # day behind and a real crypto dry spell would alert late or never.
          # Same invariant as the rest of the list: written by this run.
          # public/data/funnel_history.json (2026-07-30, Task 2): this run's
          # crypto publish appends its funnel row there — same written-by-this-
          # run invariant as everything else in the list.
          PATHS="public/data/crypto_vivek.json public/data/crypto_vivek_detail.json public/data/crypto_prices.json public/data/sectors.json public/data/fx.json public/data/bot_rules.json public/data/vivek_bot_book.json journal/vivek_bot_book.json journal/vivek_bot_book.crypto.json journal/vivek_bot_book.unassigned.json data/universe_cache/crypto.json data/scan_health.json public/data/funnel_history.json"
          # ONE path per git add (2026-07-20 hotfix): `git add a b missing`
          # stages NOTHING when any single pathspec matches no file. The
          # unassigned book file only exists when migration finds strays, so
          # its absence made every add fail wholesale — green runs, zero
          # commits, frozen site. Per-path adds cannot couple like that.
          for p in $PATHS; do git add -- "$p" 2>/dev/null || true; done
          git diff --cached --stat | tail -5
          # Must-change gate (2026-07-20 Phase 5): every non-dry bot run
          # re-stamps the book's updated_at, so a scheduled run staging
          # NOTHING is always a bug (the Phase 3 staging bug ran green 5x
          # exactly this way). Manual dispatches only warn.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            bash scripts/assert_staged.sh "crypto output" journal/vivek_bot_book.json
          else
            bash scripts/assert_staged.sh "crypto output (manual)" journal/vivek_bot_book.json \
              || echo "::warning::book not staged (manual run - dry-run or test args?)"
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: crypto bot $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)
          # Re-apply OUR files onto the freshest main. Safe because $PATHS is
          # surgical (see above) and scan-group workflows serialize.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              # TOP100 #42 — only ever REPLACE a path this run actually
              # generated. The old form ran `git rm` unconditionally and then
              # let the checkout fail silently into `|| true`, so any path
              # present on the freshly-fetched main but ABSENT from $SHA was
              # deleted, staged by the `git add -A` below, and pushed. Nothing
              # in the loop could tell that apart from an intentional delete.
              # It is not hypothetical: several listed paths exist only
              # sometimes (the unassigned book is written only when migration
              # finds strays), and every workflow in the scan group re-applies
              # its own list on top of a main that a sibling may have just
              # written — so the loop written to survive a push race could
              # lose one instead. If $SHA does not have it, this run did not
              # generate it, so main's copy is the newer one: leave it.
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            # The COMBINED book is a DERIVED file shared by every scan-group
            # workflow (2026-07-20 evening incident): a run queued on an OLD
            # checkout that loses the push race re-applies its STALE combined
            # over marks a fresher run just committed (canonical per-market
            # files stay correct; only the derived view diverges until the
            # next run). Regenerate it from the CURRENT tree instead of
            # trusting this run's snapshot.
            python -m scanner.broker.vivek_run --rebuild-combined
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: crypto bot $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1

      # Freshness watchdog (2026-07-20, Phase 5): cross-checks EVERY critical
      # pipeline (incl. kill_switch.yml aliveness, which commits nothing and
      # is otherwise invisible). Second host besides kill_switch.yml so a
      # scheduler skip of one workflow doesn't blind the monitor.
      - name: Freshness watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_HOST: crypto_bot
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GBS_SMTP_HOST: ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT: ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER: ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS: ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO: ${{ secrets.GBS_ALERT_TO }}
        run: python -m scanner.watchdog

      # If anything above failed, say so — otherwise the site quietly serves
      # stale data and nobody notices until the freshness badge goes orange.
      - name: Alert on failure (Discord)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "No webhook configured - skipping."; exit 0; }
          # The stored secret still carries its leading U+FEFF (ALERT DELIVERY,
          # 2026-08-01). curl parses "<BOM>https" as a HOSTNAME and the rest as
          # a port ("Port number was not a decimal number"), so this ping died
          # inside `|| true` on every red run -- proven live by turtle run #29
          # (2026-08-24). Same trim as config.clean_secret, inlined: ends only.
          URL=$(python3 -c 'import os,sys; sys.stdout.write(os.environ["DISCORD_WEBHOOK_URL"].strip(" \t\r\n\ufeff\u200b\u200c\u200d\u200e\u200f"))' || true)
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            -A 'vivek5-alerts/1.0 (+github-actions)' \
            -d "{\"content\":\"WARNING: **${{ github.workflow }}** run FAILED - scan data may be going stale. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$URL" \
            || echo "::warning::Discord failure ping did not deliver - this red run is the only alarm"
