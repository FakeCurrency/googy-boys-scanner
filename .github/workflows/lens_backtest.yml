name: Weekly lens backtests

# Re-runs the PhaseMap (all 3 markets) and Specs proof-of-edge replays every
# week and commits the refreshed artefacts:
#   phasemap/backtest/reports/*.md        — the human proof records
#   phasemap/backtest/stats/*.json        — the narration {stats} gate inputs
#   public/data/phasemap/stats/*.json     — the Insights page's live numbers
# This keeps every published hit-rate honest as markets move, instead of the
# site quoting a backtest from months ago.
on:
  schedule:
    - cron: "0 8 * * 0"        # Sunday 08:00 UTC ≈ 18:00 Melbourne — markets shut
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lens-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: PhaseMap backtests (5y, all markets)
        run: |
          set +e
          python -m phasemap.backtest --market nasdaq --period 5y --write-stats
          RC_NAS=$?
          python -m phasemap.backtest --market crypto --period 5y --write-stats
          RC_CRY=$?
          python -m phasemap.backtest --market asx --period 5y --write-stats
          RC_ASX=$?
          echo "backtest rc: asx=$RC_ASX nasdaq=$RC_NAS crypto=$RC_CRY"
          [ "$RC_ASX" -eq 0 ] && [ "$RC_NAS" -eq 0 ]

      - name: Specs backtest (5y, ASX)
        continue-on-error: true
        run: python -m scanner.spec_backtest --market asx --period 5y

      - name: VIVEK walk-forward backtest (5y, all markets)
        continue-on-error: true
        run: python -m scanner.vivek_backtest --market all --limit 60 --period 5y

      - name: Commit & push refreshed proof records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS="phasemap/backtest/reports phasemap/backtest/stats public/data/phasemap/stats public/data/vivek_backtest.json"
          # TOP100 #52/#54 follow-on (2026-07-28) — was
          # `git add $PATHS 2>/dev/null || true`, the third occurrence of the
          # construct that took confluence.yml and phasemap.yml down: `git add
          # a b` is ALL-OR-NOTHING, so one missing path exits 128 and stages
          # NEITHER, and the `|| true` then hands the empty index to the
          # "No changes to commit" line below, which exits GREEN.
          #
          # Stated honestly: unlike those two, the bug is LATENT here — all
          # four paths are tracked in the repo, so a fresh checkout always has
          # them and the add cannot currently fail. It is repaired anyway
          # because a latent instance is the one that gets copied into the next
          # workflow, where it will not be latent; and because two of the three
          # producing steps above are `continue-on-error: true`, so this step is
          # already reached with results it cannot assume exist.
          for p in $PATHS; do
            if [ -e "$p" ]; then
              git add -- "$p"
            else
              echo "::warning::$p is not present - nothing to stage for it"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: weekly lens backtests $(date -u +'%Y-%m-%d')"
          SHA=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              # TOP100 #42 — only ever REPLACE a path this run actually
              # generated. The old form ran `git rm` unconditionally and then
              # let the checkout fail silently into `|| true`, so any path
              # present on the freshly-fetched main but ABSENT from $SHA was
              # deleted, staged by the `git add -A` below, and pushed. Nothing
              # in the loop could tell that apart from an intentional delete.
              # It is not hypothetical: several listed paths exist only
              # sometimes (the unassigned book is written only when migration
              # finds strays), and every workflow in the scan group re-applies
              # its own list on top of a main that a sibling may have just
              # written — so the loop written to survive a push race could
              # lose one instead. If $SHA does not have it, this run did not
              # generate it, so main's copy is the newer one: leave it.
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: weekly lens backtests $(date -u +'%Y-%m-%d')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1
