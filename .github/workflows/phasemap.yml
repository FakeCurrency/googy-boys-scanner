name: PhaseMap nightly scan

# Zone-based AMD scanner (phasemap/). EOD daily bars, one snapshot per market:
#   public/data/phasemap/<market>/latest.json  (+ dated copy)
#   public/data/phasemap/charts/<market>/<TICKER>.json  (chart-page candles)
# Runs nightly after the ASX close (~18:30 Melbourne = 08:30 UTC in AEST;
# fires an hour later in Melbourne during AEDT Oct-Apr, which is fine — all
# three markets' sessions are complete either way). Crypto trades 24/7, so
# the job runs every day, not just weekdays.
on:
  # SCHEDULE RE-REGISTRATION (2026-07-30): the scheduler stopped creating runs
  # for EVERY cron in this repo after ~01:15 UTC — the same window in which
  # GitHub's ref backend was erroring (crypto_bot #255, "fatal error in
  # commit_refs"). This touch re-registers all schedules (2026-07-24 precedent).
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to scan"
        default: "all"
        required: false
        type: choice
        options: ["all", "asx", "nasdaq", "crypto"]
      args:
        description: "Extra args for phasemap.run (e.g. --limit 25 for a quick test)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: phasemap
  cancel-in-progress: false

jobs:
  phasemap:
    runs-on: ubuntu-latest
    # TOP100 #44 - full ASX directory (~2,000 names) plus the two small
    # markets and the specs pass. Holds `group: phasemap`, so a hang here
    # stalls every later PhaseMap refresh, not just this one. Same 120 as
    # the other jobs that walk the whole ASX directory - scan.yml records a
    # 40-80 min 3-market cycle and ASX is the bulk of it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same Yahoo etiquette as the main scan: the two small markets (~100
      # names each) run together and finish in minutes, then the full ASX
      # directory (~2,000 names) gets Yahoo to itself for best coverage.
      - name: Run PhaseMap scans
        env:
          # Free-text input passes through env, never ${{ }} inside run:
          # (2026-07-20 security pass) — the runner does not shell-interpolate
          # env values, so a crafted input can't inject commands.
          ARGS: ${{ github.event.inputs.args }}
        run: |
          set +e
          MARKET="${{ github.event.inputs.market }}"
          MARKET="${MARKET:-all}"

          if [ "$MARKET" != "all" ]; then
            echo "Single-market PhaseMap scan: $MARKET"
            python -m phasemap.run --market "$MARKET" $ARGS
            exit $?
          fi

          python -m phasemap.run --market nasdaq $ARGS &
          PID_NAS=$!
          python -m phasemap.run --market crypto $ARGS &
          PID_CRY=$!
          wait $PID_NAS; RC_NAS=$?
          wait $PID_CRY; RC_CRY=$?
          echo "small markets done — nasdaq=$RC_NAS crypto=$RC_CRY; now ASX alone"
          python -m phasemap.run --market asx $ARGS
          RC_ASX=$?
          echo "phasemap rc: asx=$RC_ASX nasdaq=$RC_NAS crypto=$RC_CRY"
          # Crypto is best-effort (keyless feeds can be flaky); ASX+NASDAQ gate the job.
          [ "$RC_ASX" -eq 0 ] && [ "$RC_NAS" -eq 0 ]

      # Specs — the third lens (volume-spike base breakouts, sub-$0.50).
      # Nightly cadence like PhaseMap; ASX + NASDAQ only (no crypto).
      #
      # TOP100 #54 (2026-07-28) — this was `continue-on-error: true` and
      # nothing else, so a failed Specs run produced a neutral step icon on a
      # nightly nobody opens and no other signal anywhere. That is not a
      # cosmetic gap, because Specs is a CONFLUENCE LENS:
      # `confluence_alert._read(DATA / f"{market}_spec.json")` loads the file
      # and iterates `results` with NO freshness check, so a frozen spec file
      # keeps voting. A "triple-lens agreement" @here ping can therefore be
      # two live lenses plus a Specs row from last week, and the ping is the
      # headline feature — it looks exactly like the real thing.
      #
      # The tolerance stays: Specs' own backtest calls it a shortlist
      # generator, not an entry system, and killing the whole nightly PhaseMap
      # publish because the third lens choked is the wrong trade. What changes
      # is that the outcome is now RECORDED (an output the commit step reads)
      # and SAID (::warning::, which renders in the run summary header rather
      # than as a step icon). The explicit if/else is what makes the echo
      # reachable: under continue-on-error the default `bash -e` aborts at the
      # failing command and no message runs.
      - name: Run Specs scan
        id: specs
        run: |
          if python -m scanner.spec_run --market all; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Specs scan FAILED - public/data/{asx,nasdaq}_spec.json are STALE. scanner/confluence_alert.py reads them with no freshness check, so tonight's confluence banners and @here pings may count a Specs leg that is days old. PhaseMap published normally."
          fi

      # Confluence alert REMOVED from this workflow (2026-07-20, review H6):
      # its dedupe state (journal/confluence_state.json + alert_history.json)
      # was committed from TWO concurrency groups (phasemap + scan), so the
      # groups could revert each other's state — duplicate @here pings or lost
      # alerts. The scan-group now solely owns confluence: intraday runs in
      # scan.yml, plus the tiny confluence.yml at 08:45 UTC (right after this
      # nightly's data lands) to pick up fresh PhaseMap/Specs alignments.

      # Schema gate: every freshly published snapshot must pass the writer's own
      # validator (zones are bands, states/tiers legal, current ruleset version)
      # before it ships. latest.json is the SLIM published form — narration
      # lives in the narrations.json sidecar — so validate the pair together.
      - name: Verify PhaseMap snapshots
        run: |
          python - <<'PY'
          import json, glob, os, sys
          from phasemap.config import RULESET_VERSION
          from phasemap.output.writer import validate_published
          files = glob.glob("public/data/phasemap/*/latest.json")
          if not files:
              print("SCHEMA GATE FAILED: no snapshots written"); sys.exit(1)
          bad = []
          for f in files:
              try:
                  slim = json.load(open(f, encoding="utf-8"))
                  nf = os.path.join(os.path.dirname(f), "narrations.json")
                  narr = json.load(open(nf, encoding="utf-8")) if os.path.exists(nf) else None
                  validate_published(slim, narr)
                  if slim["ruleset_version"] != RULESET_VERSION:
                      bad.append(f"{f}: ruleset {slim['ruleset_version']} != {RULESET_VERSION}")
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("SCHEMA GATE FAILED:"); [print(" -", b) for b in bad]; sys.exit(1)
          print(f"schema gate OK — {len(files)} published snapshots at ruleset v{RULESET_VERSION}")
          PY

      - name: Commit & push fresh data (triggers Cloudflare deploy)
        env:
          # TOP100 #54 — the Specs step is deliberately tolerated (see its
          # comment), so its outcome has to travel to the gate below as DATA.
          # Without this the gate cannot tell "Specs was allowed to fail" from
          # "Specs succeeded and wrote nothing", and those want opposite
          # responses: a warning, and a red job.
          SPECS_OK: ${{ steps.specs.outputs.ok }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SURGICAL paths (2026-07-20, reviews C3+H6): per-market snapshot
          # dirs + charts — NOT the whole public/data/phasemap dir, which also
          # contains alert_history.json (owned by the scan group's confluence)
          # and stats/ (owned by lens_backtest.yml); re-applying those from
          # this run's stale checkout reverted the owners' fresher pushes.
          # journal/confluence_state.json dropped: confluence no longer runs here.
          # spec_graduation.json (2026-07-31): the Specs->VIVEK graduation
          # registry — spec_run is its ONLY writer, so it belongs to this
          # workflow's list. Deliberately NOT in the must-change gate below:
          # specgrad is report-only and its failure is swallowed by design
          # (spec_run still exits 0), so a must-change assert would convert a
          # tolerated report failure into a red nightly — the funnel history
          # in scan.yml made the same call. A missed night self-heals on the
          # next one.
          PATHS="public/data/phasemap/asx public/data/phasemap/nasdaq public/data/phasemap/crypto public/data/phasemap/charts public/data/asx_spec.json public/data/nasdaq_spec.json public/data/spec_charts public/data/spec_graduation.json"
          # TOP100 #54 (2026-07-28) — was `git add $PATHS 2>/dev/null || true`.
          # `git add a b` is ALL-OR-NOTHING: with one path missing it exits 128
          # with "pathspec did not match any files" and stages NEITHER
          # (verified, not assumed). Eight paths here, and the two spec files
          # are exactly the ones a failed Specs step can leave absent on a fresh
          # checkout — so the tolerated failure could take the PhaseMap
          # snapshots down with it, silently, via the `|| true`. Staged one at
          # a time so a missing sibling cannot veto a path that is present.
          for p in $PATHS; do
            if [ -e "$p" ]; then
              git add -- "$p"
            else
              echo "::warning::$p is not present - nothing to stage for it"
            fi
          done
          # Must-change gate (2026-07-20 Phase 5): a successful nightly ALWAYS
          # advances every market's latest.json (run_date is daily) — staging
          # none of them means output is being lost; fail loudly. Manual
          # single-market dispatches only warn.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            bash scripts/assert_staged.sh "phasemap asx"    public/data/phasemap/asx/latest.json
            bash scripts/assert_staged.sh "phasemap nasdaq" public/data/phasemap/nasdaq/latest.json
            bash scripts/assert_staged.sh "phasemap crypto" public/data/phasemap/crypto/latest.json
            # TOP100 #54 — the spec files got the same must-change treatment,
            # but GATED on the Specs step having reported success. Asserting
            # them unconditionally would convert a deliberately-tolerated
            # network failure into a red job, which is the tolerance decision
            # reversed by the back door. Gated, the assert catches the case the
            # tolerance never covered: Specs exited 0 and still wrote nothing.
            # Safe because scanner/spec_run.py stamps `generated_at` on every
            # successful scan_market and os.replace()s the file, so rc=0
            # guarantees both files were rewritten and therefore differ.
            if [ "$SPECS_OK" = "true" ]; then
              bash scripts/assert_staged.sh "specs asx"    public/data/asx_spec.json
              bash scripts/assert_staged.sh "specs nasdaq" public/data/nasdaq_spec.json
            else
              echo "::warning::Specs reported failure - skipping its must-change gate. The spec files on the site are last night's or older, and confluence_alert reads them with no freshness check."
            fi
          else
            bash scripts/assert_staged.sh "phasemap (manual)" \
              public/data/phasemap/asx/latest.json \
              public/data/phasemap/nasdaq/latest.json \
              public/data/phasemap/crypto/latest.json \
              || echo "::warning::no latest.json staged (manual run)"
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: phasemap $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)
          # Generated data is fully recomputed each run — the latest scan wins.
          # Rebase onto the freshest main and re-apply our outputs on top, with
          # push retries in case a market scan lands at the same moment.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              # TOP100 #42 — only ever REPLACE a path this run actually
              # generated. The old form ran `git rm` unconditionally and then
              # let the checkout fail silently into `|| true`, so any path
              # present on the freshly-fetched main but ABSENT from $SHA was
              # deleted, staged by the `git add -A` below, and pushed. Nothing
              # in the loop could tell that apart from an intentional delete.
              # It is not hypothetical: several listed paths exist only
              # sometimes (the unassigned book is written only when migration
              # finds strays), and every workflow in the scan group re-applies
              # its own list on top of a main that a sibling may have just
              # written — so the loop written to survive a push race could
              # lose one instead. If $SHA does not have it, this run did not
              # generate it, so main's copy is the newer one: leave it.
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: phasemap $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1

