name: Scheduled scan

# Markets are scanned STRICTLY SEQUENTIALLY (2026-07-20, review C1): every
# `scanner.run` invocation rewrites the whole shared bot book
# (journal/vivek_bot_book.json) via load→modify→write, so two concurrent
# market processes race and the last writer silently erases the other's
# closed trades / realised P&L — corrupting the system's only track record.
# One market at a time = one book writer at a time. Costs a few minutes of
# wall-clock per full cycle; buys an intact track record.
# Pushing to main triggers Cloudflare Pages to redeploy the site automatically.
on:
  # SCHEDULE RE-REGISTRATION (2026-07-30): the scheduler stopped creating runs
  # for EVERY cron in this repo after ~01:15 UTC — the same window in which
  # GitHub's ref backend was erroring (crypto_bot #255, "fatal error in
  # commit_refs"). This touch re-registers all schedules (2026-07-24 precedent).
  schedule:
    # Hourly during trading hours (UTC). GitHub cron is best-effort, may be a few mins late.
    # ASX  10:00 AM–4:00 PM AEST  = 00:00–06:00 UTC
    # NASDAQ 9:30 AM–4:00 PM ET   = 13:30–21:00 UTC  (EDT; add 1h in EST winter)
    #
    # SCHEDULE RE-REGISTRATION (2026-07-24): GitHub's scheduler silently dropped
    # the 00:07 / 01:07 / 02:07 ASX runs (no run created at all — the same
    # "silently skipped morning runs" failure the :07 move was meant to dodge;
    # every run that DID start stayed green). A file-touch re-registration at
    # 02:19 did NOT bring the 03:07 cron back, so the :47 SELF-HEALING BACKSTOP
    # below now covers the window: it fires 40 min after each :07 slot, asks the
    # LIVE site's /api/health whether a scan landed within the last hour, and
    # skips itself when one did. A healthy scheduler costs zero extra runs; a
    # ghosted :07 is caught within the hour instead of aging into a watchdog
    # alert. (Gate logic: see the backstop branch in the gate job below.)
    #
    # OFF-:00 MINUTES (2026-07-22): GitHub's scheduler is most congested at the
    # top of the hour — their own docs recommend a random minute — and this
    # repo has recorded 48-min drift and silently skipped morning runs. :07
    # keeps the same effective cadence while dodging the worst-load slot.
    #
    # TOP100 #41 — DAYLIGHT SAVING. Every ASX cron below is written for AEST
    # (UTC+10), which is only correct Apr–Oct. From the first Sunday in October
    # Melbourne moves to AEDT (UTC+11) and the 10:00–16:00 session becomes
    # 23:00–05:00 UTC — i.e. it OPENS ON THE PREVIOUS UTC DAY. The `0-5` hours
    # below then cover 11:00–16:00 AEDT only, and the first hour of every ASX
    # session — the open, the hour that matters most — has no scan at all. For
    # Monday it is worse: Monday's open is Sunday 23:00 UTC, which `* * 1-5`
    # excludes outright, so nothing fires and nothing notices. This is latent
    # right now (it is July, AEST) and would have gone live in October.
    #
    # Fixed the way kill_switch.yml fixed the same bug class: let cron fire a
    # SUPERSET and let the gate decide with real Melbourne local time. The two
    # 23:xx crons below are no-ops under AEST — the gate skips them outright —
    # so nothing about today's behaviour changes.
    - cron: "7 0-5 * * 1-5"       # ASX  00:07–05:07 UTC (hourly)
    - cron: "47 0-5 * * 1-5"      # ASX BACKSTOP — no-op unless the :07 ghosted (gate job)
    - cron: "7 23 * * 0-4"        # ASX AEDT OPEN — 23:07 UTC = 10:07 next-day AEDT.
                                  # Sun–Thu because Monday's open is Sunday in UTC.
                                  # Skipped by the gate while Melbourne is on AEST.
    - cron: "47 23 * * 0-4"       # ASX AEDT OPEN BACKSTOP — same freshness probe as :47
    - cron: "37 6 * * 1-5"        # ASX  06:37 UTC ≈ 4:37 PM AEST (closing alert)
    - cron: "37 13 * * 1-5"       # NASDAQ open  13:37 UTC
    - cron: "7 14-20 * * 1-5"     # NASDAQ 14:07–20:07 UTC (hourly)
    - cron: "7 21 * * 1-5"        # NASDAQ close 21:07 UTC
    - cron: "7 2,8,14,20 * * 0,6" # weekends: crypto only, 6-hourly (24/7 market —
                                  # dashboard data used to stale from Fri to Mon)
  workflow_dispatch:
    inputs:
      market:
        description: "Market to scan"
        default: "all"
        required: false
        type: choice
        options: ["all", "asx", "nasdaq", "crypto"]
      args:
        description: "Extra args for scanner.run (e.g. --limit 12 for a quick test)"
        default: ""
        required: false
      # Who dispatched this run (2026-08-20) — the heartbeat healer passes
      # "heartbeat"; humans and the SCAN button leave the default. Stamped
      # into funnel_history rows as `trigger` so scheduler-throttling and
      # heal frequency become visible continuously instead of by audit.
      reason:
        description: "What dispatched this run (heartbeat healer passes 'heartbeat'; leave default)"
        default: "manual"
        required: false

permissions:
  contents: write

# NOTE: the "scan" mutex now lives on the `scan` JOB, not here at workflow
# level. See the comment on that job — moving it is what lets the gate below
# actually reach its own curl. Do not re-add a workflow-level concurrency
# block: it re-breaks every freshness backstop in this repo at once.

jobs:
  # Markets are closed on weekends, so scheduled stock scans there are pointless.
  # GitHub's scheduler can also fire delayed/batched runs into Saturday/Sunday —
  # this gate skips those. Manual (workflow_dispatch / SCAN button) runs are
  # always allowed, any day. Crypto stays live 24/7 via crypto_scalp.yml.
  gate:
    runs-on: ubuntu-latest
    # TOP100 #44 - the gate only checks the clock and the freshness probe.
    # It is outside the mutex, but a hung curl here blocks the scan job
    # behind `needs:` just as effectively.
    timeout-minutes: 5
    # TOP100 #56 (2026-07-28) - the workflow-level `contents: write` above is
    # for the SCAN job, which commits. This job checks out nothing, writes
    # nothing but $GITHUB_OUTPUT, and its one network call is a curl to the
    # public /api/health - yet it was handed a token that can push to main.
    # Every scheduled fire of this workflow runs it, which makes it the most
    # frequently-executed job in the repo and the cheapest place to take the
    # write bit away. `read` rather than `none` deliberately: a future step
    # here would almost certainly start with actions/checkout, and a checkout
    # failing on permissions is the kind of error someone fixes by putting the
    # write back.
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      market_override: ${{ steps.check.outputs.market_override }}
    steps:
      - id: check
        run: |
          DOW=$(date -u +%u)   # 1=Mon … 6=Sat 7=Sun
          SCHED="${{ github.event.schedule }}"

          # TOP100 #41 — DAYLIGHT SAVING. The two 23:xx crons exist ONLY to
          # cover the ASX open once Melbourne is on AEDT (UTC+11), when the
          # session shifts to 23:00–05:00 UTC and its first hour falls on the
          # previous UTC day. Under AEST (UTC+10) 23:07 UTC is 09:07 — an hour
          # BEFORE the open — so they must not run. Ask the tz database rather
          # than hardcoding the changeover dates, which move and which are the
          # thing that made the original crons wrong in the first place.
          #
          # This branch returns EARLY and deliberately: 23:00 UTC Sunday is
          # 10:00 Monday in Melbourne, and the `DOW -ge 6` weekend test further
          # down reads UTC days, so letting a Sunday-night AEDT open reach it
          # would downgrade the ASX open to a crypto-only scan. Handling the
          # slot here means the weekend rule keeps its UTC semantics, which is
          # what NASDAQ's Friday 21:07 UTC close scan depends on.
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$SCHED" = "7 23 * * 0-4" ] || [ "$SCHED" = "47 23 * * 0-4" ]; }; then
            OFFSET=$(python3 -c "import datetime as dt;from zoneinfo import ZoneInfo;print(int(dt.datetime.now(ZoneInfo('Australia/Melbourne')).utcoffset().total_seconds()//3600))" 2>/dev/null || echo "")
            echo "AEDT-open slot [$SCHED] — Melbourne UTC offset reads: ${OFFSET:-unknown}"
            if [ "$OFFSET" = "10" ]; then
              echo "Melbourne is on AEST — 23:07 UTC is an hour before the open. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "market_override=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Not AEST (AEDT, or the offset probe failed): this IS the open.
            # Fail open, same rule as the freshness backstops below — an extra
            # pre-open scan costs one run, a missed open costs the session.
            if [ "$SCHED" = "47 23 * * 0-4" ]; then
              HEALTH=$(curl -sS --max-time 20 "https://googy-boys-scanner.pages.dev/api/health?market=asx&max_h=1" || echo "")
              echo "AEDT open backstop health probe: $HEALTH"
              if echo "$HEALTH" | grep -Eq '"ok": ?true'; then
                echo "Backstop 23:47 — an ASX scan already landed this hour. Skipping."
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "market_override=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Backstop 23:47 — ASX data stale or probe failed. Running the missed open."
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "market_override=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # :47 ASX BACKSTOP (2026-07-24): only exists to catch a :07 run the
          # GitHub scheduler silently never started. Ask the LIVE site whether
          # an ASX scan landed within the last hour (max_h=1); if yes, this run
          # is redundant — skip. If the data is stale OR health is unreachable,
          # run the missed scan (fail open: a broken probe must never leave
          # the site stale).
          #
          # market=asx IS LOAD-BEARING (2026-07-28). Without it the probe read
          # the COMBINED bot book, whose updated_at moves whenever ANY market
          # commits — so it answered "did the pipeline commit?" when the only
          # question this backstop cares about is "did ASX scan?". Worked example
          # from the commit log: at 01:47 UTC Mon 2026-07-27 the combined book was
          # 24 min old (crypto_bot's 01:23 commit) so the old probe said ok:true
          # and this backstop skipped — while the newest ASX scan was 4.6 h old
          # (Sun 21:11) and the 00:07 + 01:07 ASX crons had both produced nothing.
          # Exactly the miss it exists to catch, waved through by a probe aimed at
          # the wrong file. Scoping it to this backstop's own market is the fix.
          # Pinned by test/health.test.js ("the combined book hides a stale ASX").
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "47 0-5 * * 1-5" ]; then
            HEALTH=$(curl -sS --max-time 20 "https://googy-boys-scanner.pages.dev/api/health?market=asx&max_h=1" || echo "")
            echo "backstop health probe: $HEALTH"
            if echo "$HEALTH" | grep -Eq '"ok": ?true'; then
              echo "Backstop :47 — an ASX scan already landed this hour. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "market_override=" >> "$GITHUB_OUTPUT"
            else
              echo "Backstop :47 — ASX data stale or probe failed. Running the missed scan."
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "market_override=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" -ge 6 ]; then
            # Weekend schedule: stock markets are shut, but crypto trades 24/7 —
            # run a crypto-only scan so the dashboard doesn't stale Fri->Mon.
            echo "Weekend scheduled run — crypto only."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "market_override=crypto" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "market_override=" >> "$GITHUB_OUTPUT"
          fi

  # THE "scan" MUTEX LIVES HERE, NOT AT WORKFLOW LEVEL (2026-07-28).
  #
  # Why it matters: this group is shared with crypto_bot.yml so the two never
  # write the paper book at once — a real invariant, and load-bearing now that
  # the book cap is GLOBAL (30 across all markets: two concurrent writers could
  # each read "23 open" and both open, blowing the ceiling). That part is kept
  # exactly as it was; only the SCOPE changed.
  #
  # What was broken: GitHub allows ONE pending run per concurrency group — a
  # newly-queued run CANCELS the previously-pending one. With the group applied
  # at workflow level, four arrivals per hour landed in a one-slot queue during
  # ASX mornings (:07 scan, :22 crypto, :47 this backstop, :52 crypto backstop)
  # while a full 3-market cycle runs 40–80 min. So whenever a scan was in
  # progress, the :47 ASX backstop went pending and the :52 crypto arrival
  # cancelled it five minutes later — every time, deterministically. Both of
  # this repo's freshness backstops were added to catch dropped runs, and both
  # were being dropped by each other before their gate job could run a single
  # curl. That is the self-defeating shape: adding crons to a saturated
  # one-slot queue makes cancellation MORE likely, not less.
  #
  # The fix: gate jobs are cheap (one curl, ~15 s) and write nothing, so they
  # no longer belong in the mutex. They now always execute and decide; only
  # this job — the one that actually scans and commits — queues. A backstop
  # that decides "fresh, skip" now costs zero queue slots instead of evicting
  # whatever was waiting. Mutual exclusion between writers is unchanged.
  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # TOP100 #44 - this job holds the `scan` mutex. Without an explicit
    # timeout a hung step (a Yahoo socket that never returns, a push retry
    # loop that never resolves) holds the group for GitHub's 6-hour default,
    # and EVERY close, scan and crypto run queued behind it is evicted -
    # GitHub keeps one pending run per group and cancels the previous one.
    # One stuck run therefore costs a whole session of scans, silently.
    # 120, not 60: the mutex comment above records a real full 3-market cycle
    # at 40-80 min, so an hour-ish budget would kill healthy slow days and
    # resurrect the failure-email problem. This is a hang detector - it bounds
    # the blast radius at one session instead of six hours - not a perf budget.
    timeout-minutes: 120
    concurrency:
      group: scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Last-good per-ticker frame cache: tickers Yahoo throttles out of one run
      # are reused from here so coverage stays high. Keyed by run number so each
      # run restores the most recent cache and writes an updated one.
      - name: Restore frame cache
        uses: actions/cache@v4
        with:
          path: .cache/frames
          key: vivek-frames-${{ github.run_id }}
          restore-keys: |
            vivek-frames-

      # Refresh the market-cap cache FIRST, on a fresh IP — Yahoo throttles its
      # fundamentals endpoint after the heavy scan download, so fetching caps
      # here (before the scan) is the reliable window. Reads the previous scan's
      # A+/A symbols; the persistent cache fills in over a couple of runs.
      - name: Refresh market-cap cache
        continue-on-error: true
        run: python -m scanner.marketcaps

      # Fix-10 #10: incremental per-ticker sector cache (NASDAQ's directory
      # has no sectors) — same fresh-IP window as the caps refresh, ~40
      # missing symbols per run, best grades first.
      #
      # TOP100 #53 (2026-07-28) — this comment used to end "Display-only
      # sidecar; never allowed to fail the run." The first half stopped being
      # true at REFINEMENTS #38: `broker/vivek_run.py` now calls
      # `sectorcache.enrich_rows` on the rows `decide()` sees, so the map
      # decides which names the 3-per-sector cap can SEE, and a row with no
      # sector is exempt from the cap entirely. A stale line in a workflow is
      # not cosmetic — "display-only" is the sentence a future reader (or I)
      # would quote while widening this tolerance or deleting the step.
      #
      # The tolerance itself stays, and deliberately. This is a best-effort
      # Yahoo fundamentals fetch; failing the whole 3-market cycle because it
      # got throttled resurrects the failure-email problem for something that
      # cannot corrupt anything — enrichment only ever writes into a BLANK
      # field, so a failed refresh is a no-op on the existing map, never a
      # clear. What changes is that coverage does not advance, which loosens
      # the cap rather than tightening it, which is the direction you can
      # afford to be quiet about for one run and not for twenty.
      #
      # So the failure is made LOUD instead of fatal. `continue-on-error: true`
      # buys a neutral step icon on the run page of a job that fires ~20x a
      # day and that nobody opens; `::warning::` renders in the run's summary
      # header and names the actual consequence. The explicit `if !` is what
      # makes the echo reachable at all — under continue-on-error the default
      # `bash -e` aborts the step at the failing command and no message runs.
      - name: Refresh sector cache
        run: |
          if ! python -m scanner.sectorcache; then
            echo "::warning::sector cache refresh FAILED - data/sector_map.json did not advance this run. It is a SIGNAL PATH (REFINEMENTS #38): rows with no sector are exempt from the 3-per-sector cap, so the cap binds LESS than intended until coverage refills. Check summary.sector_coverage in the scan output - expect ~1.0."
          fi

      - name: Run market scans (small markets first, then ASX uncontended)
        env:
          GBS_SMTP_HOST: ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT: ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER: ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS: ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO: ${{ secrets.GBS_ALERT_TO }}
          # SMTP ALONE IS NOT ENOUGH (2026-07-28). Email is the only channel
          # CRITICAL doesn't share with anything else; the two tiers that carry
          # the scan's own observations route elsewhere. NOTICE is Discord-ONLY
          # (config.ALERT_CHANNELS), so with no webhook here `trade_review`
          # ("should Claude take this, or should I?") and `sector_run` (HORIZON's
          # sustained-run alarm) resolved to an empty channel list every scan —
          # both features were shipped dark. WARNING is telegram+discord, so it
          # was landing nowhere too. Do not trim this back to SMTP.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # Free-text input via env, never ${{ }} in run: (2026-07-20 security pass)
          ARGS: ${{ github.event.inputs.args }}
          # What started this run — cron fire, heartbeat heal, or a human
          # dispatch. funnelhistory.trigger_from_env() stamps it on the row.
          SCAN_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || (github.event.inputs.reason == 'heartbeat' && 'heartbeat' || 'manual') }}
        run: |
          set +e
          MARKET="${{ github.event.inputs.market }}"
          MARKET="${MARKET:-${{ needs.gate.outputs.market_override }}}"
          MARKET="${MARKET:-all}"     # scheduled runs have no input -> full cycle
          # Tell the schema gate which files THIS run rewrote (2026-07-20):
          # a partial run must only be judged on its own output files.
          echo "SCANNED_MARKET=$MARKET" >> "$GITHUB_ENV"

          if [ "$MARKET" != "all" ]; then
            # Single-market scan (fast path) — just the one the user asked for.
            echo "Single-market scan: $MARKET"
            python -m scanner.run --market "$MARKET" $ARGS
            exit $?
          fi

          # Full cycle — SEQUENTIAL, never parallel (2026-07-20, review C1).
          # Each scanner.run rewrites the ENTIRE shared bot book
          # (journal/vivek_bot_book.json): parallel `&` processes here raced
          # load→modify→write and the last writer erased the other market's
          # closes and realised P&L from the only track record. Do NOT
          # re-parallelise without first giving the book per-market files or
          # a cross-process lock. Small markets first, ASX (the big download)
          # last — same Yahoo-friendly order as before, one at a time.
          python -m scanner.run --market nasdaq $ARGS
          RC_NAS=$?
          python -m scanner.run --market crypto $ARGS
          RC_CRY=$?
          echo "small markets done — nasdaq=$RC_NAS crypto=$RC_CRY; now ASX"
          python -m scanner.run --market asx $ARGS
          RC_ASX=$?
          echo "scan rc: asx=$RC_ASX nasdaq=$RC_NAS crypto=$RC_CRY"
          # Crypto is best-effort (keyless feeds can be flaky); ASX+NASDAQ gate the job.
          [ "$RC_ASX" -eq 0 ] && [ "$RC_NAS" -eq 0 ]

      # Schema gate: every freshly written *_vivek.json must carry the current
      # schema_version. Catches a code/data drift (the bug that hid the entry-type
      # filter) before it ships, instead of after.
      - name: Verify VIVEK data schema
        run: |
          python - <<'PY'
          import json, glob, os, sys
          from scanner import config
          want = config.VIVEK_SCHEMA_VERSION
          # Gate ONLY the files this run rewrote (2026-07-20 fix): a partial
          # run (single-market dispatch / weekend crypto-only) used to be
          # judged on sibling files still at the PREVIOUS schema version —
          # the v3->v4 bump failed the first crypto-only run exactly this
          # way. Full cycles still verify all three.
          market = os.environ.get("SCANNED_MARKET", "all")
          files = (sorted(glob.glob("public/data/*_vivek.json")) if market == "all"
                   else [f"public/data/{market}_vivek.json"])
          bad = []
          for f in files:
              try:
                  doc = json.load(open(f))
              except Exception as e:
                  bad.append(f"{f}: unreadable ({e})"); continue
              if doc.get("schema_version") != want:
                  bad.append(f"{f}: schema_version {doc.get('schema_version')} != expected {want}")
                  continue
              # v5 PAIRING CHECK (payload diet): the detail sidecar must
              # exist, parse, match the version AND carry the summary's
              # generated_at — a run that pushes one file and loses the
              # other fails HERE, not as a deck whose expand can't load.
              det = f.replace("_vivek.json", "_vivek_detail.json")
              try:
                  dd = json.load(open(det))
              except Exception as e:
                  bad.append(f"{det}: unreadable ({e})"); continue
              if dd.get("schema_version") != want:
                  bad.append(f"{det}: schema_version {dd.get('schema_version')} != expected {want}")
              elif dd.get("generated_at") != doc.get("generated_at"):
                  bad.append(f"{det}: generated_at {dd.get('generated_at')} != summary {doc.get('generated_at')}")
          if bad:
              print("SCHEMA GATE FAILED:"); [print(" -", b) for b in bad]; sys.exit(1)
          print(f"schema gate OK - {len(files)} pair(s) at v{want} (scope: {market})")
          PY

      # Track-record integrity gate (Phase 4): a malformed / cross-contaminated
      # / stale book fails the run HERE — failure email, nothing committed.
      - name: Verify book integrity
        run: python -m scanner.broker.vivek_run --verify

      # Multi-lens confluence -> Discord ping. VIVEK results just refreshed;
      # PhaseMap/Specs files are the nightly ones from the checkout. State-
      # deduped, so the intraday cadence doesn't spam. Never blocks the scan.
      - name: Confluence Discord alert
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GBS_SYNC_CODE: ${{ secrets.GBS_SYNC_CODE }}
        run: python -m scanner.confluence_alert

      # NOTE: the paper-trade journal, Telegram alerts and Discord digest read the
      # retired pullback/reversal/short scans, which the VIVEK-only pipeline no
      # longer produces. They are disabled until VIVEK-native versions are wired
      # (see ROADMAP). Re-enabling them as-is would act on stale legacy JSON.
      #
      #   - name: Update paper-trade journal
      #     run: python -m scanner.journal
      #   - name: Discord digest (new A+/A setups)
      #     run: python -m scanner.discord

      - name: Commit & push fresh data (triggers Cloudflare deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SURGICAL paths only (2026-07-20, review C3): list EXACTLY the files
          # this workflow's steps write, never a whole directory. The old bare
          # "public/data" made the retry loop below delete + re-apply the ENTIRE
          # directory from this run's stale checkout, reverting fresh files that
          # phasemap.yml / lens_backtest.yml / vivek_backtest.yml (different
          # concurrency groups) had pushed meanwhile. Invariant: every path here
          # must be written ONLY by workflows in the "scan" concurrency group.
          # (Dropped: journal/journal.json + scalp_journal.json + discord_state
          # + data/notified_signals.json — nothing in this workflow writes them.)
          # PATHS are SCOPED to what THIS run actually scanned (2026-07-26).
          # The old static full list broke the retry loop's core invariant:
          # `git checkout $SHA -- <path>` re-applies EVERY listed path from
          # this run's commit — including markets this run never scanned,
          # whose copies are just its stale checkout. A Sunday crypto-only
          # run reverted a freshly-pushed full ASX rescan (2,212 names,
          # sectors) back to a stale 93-name file exactly that way, two
          # minutes after it landed. Scoped paths restore the invariant:
          # a run only ever stages/re-applies files it generated itself.
          # (SCANNED_MARKET is exported by the scan step above.)
          M="${SCANNED_MARKET:-all}"
          # sector_breadth.json + sector_history.json + regime.json are SHARED,
          # not per-market: one run recomputes only the market it scanned and
          # MERGES it into the published file, so an ASX-only run must still
          # stage the whole thing or the NASDAQ block it just carried forward is
          # dropped. The history file is the only record the HORIZON trend column
          # has — leave it unstaged and every session starts from day one forever.
          # (regime.json has no such memory — it recomputes six months from bars
          # every run — but it is merged the same way, so it stages the same way.)
          # data/scan_health.json (2026-07-29): the consecutive-dry-run counter
          # run.py keeps per market. It MUST be in this list — the whole point
          # is surviving the container across runs (a dry run's only diff can
          # be this file, which is what makes the outage visible in the log).
          # funnel_history.json (2026-07-30, owner-ruled Task 2): the append-only
          # funnel trend. SHARED, not per-market — one file carries all three
          # markets' columns, so an asx-only run must stage the whole file or
          # the crypto rows it just carried forward are dropped (same rule as
          # sector_breadth.json). Report-only; nothing reads it back.
          SHARED="public/data/sectors.json public/data/fx.json public/data/bot_rules.json public/data/vivek_bot_book.json public/data/market_caps.json public/data/sector_map.json data/sector_map.json public/data/sector_breadth.json data/sector_history.json data/scan_health.json public/data/regime.json public/data/phasemap/alert_history.json journal/vivek_bot_book.json journal/vivek_bot_book.unassigned.json journal/confluence_state.json data/market_caps.json public/data/funnel_history.json data/history"
          if [ "$M" = "all" ]; then MK="asx nasdaq crypto"; else MK="$M"; fi
          PATHS="$SHARED"
          for m in $MK; do
            # ${m}_arriving.json (2026-07-30, owner-ruled): the fenced
            # report-only "liquidity arriving" file. Staged like any artefact;
            # nothing in scanner/broker/ reads it (test-pinned).
            PATHS="$PATHS public/data/${m}_vivek.json public/data/${m}_vivek_detail.json public/data/${m}_prices.json public/data/${m}_arriving.json journal/vivek_bot_book.${m}.json data/universe_cache/${m}.json"
          done
          echo "staging scope: $M -> $PATHS"
          # ONE path per git add (2026-07-20 hotfix): `git add a b missing`
          # stages NOTHING when any single pathspec matches no file. The
          # unassigned book file only exists when migration finds strays, so
          # its absence made every add fail wholesale — green runs, zero
          # commits, frozen site. Per-path adds cannot couple like that.
          for p in $PATHS; do git add -- "$p" 2>/dev/null || true; done
          git diff --cached --stat | tail -5
          # Must-change gate (2026-07-20 Phase 5): every scan rewrites the
          # *_vivek.json files (wall-clock generated_at) and every non-dry bot
          # run re-stamps the book's updated_at — a scheduled run staging
          # NOTHING is always a bug (the Phase 3 staging bug ran green 5x
          # exactly this way). Manual dispatches (--dry-run/--limit tests)
          # only warn.
          #
          # TOP100 #49 - ONE path was being asserted, and it was the DERIVED one.
          # `journal/vivek_bot_book.json` is `_write_combined()` output; the
          # canonical state is the per-market files. So the gate passed on a run
          # where two of three markets saved and the third silently did not -
          # `run.py` wraps the whole bot layer in `except Exception: print("bot
          # book: skipped")`, so a market's execution layer can throw, be
          # swallowed, and leave the scan green with the combined book still
          # changing because its SIBLINGS moved. It also said nothing at all
          # about the scan's own output: a run that rewrote no *_vivek.json but
          # re-stamped the book passed, which is the site freezing while the
          # gate that exists to catch a frozen site nods it through.
          #
          # assert_staged's own contract: "all must change" = several calls, one
          # path each. Four independent invariants, so four calls.
          #   (1) the scan's data file, per market it actually scanned;
          #   (2) that market's CANONICAL book file;
          #   (3) the derived journal-side combined view (the old check);
          #   (4) its public twin - written from the same payload by
          #       `_write_combined`, so it can only diverge here by being
          #       dropped from $SHARED, which is a one-token edit to a long
          #       space-separated string and would freeze the dashboard's book
          #       while the journal's advanced. `--verify` cannot see this: it
          #       compares the working tree, not what got committed.
          #
          # CRYPTO IS EXEMPT, but only as one leg of a FULL cycle - which is
          # exactly where the scan step itself declines to gate on it ("crypto
          # is best-effort, keyless feeds can be flaky"; only RC_ASX and RC_NAS
          # gate the job). On a crypto-only weekend run crypto IS the gating
          # market and is asserted like any other. Making the gate stricter than
          # the step it is gating would fail whole cycles over a flaky feed and
          # resurrect the failure-email problem.
          # 2026-07-28 incident. A market whose download comes back fully empty
          # AND whose frame cache has nothing to fall back on takes run.py's
          # deliberate `continue`: it keeps yesterday's JSON rather than
          # clobbering it, and exits 0 on purpose, because that is a REPORTED
          # DECISION, not a fault (TOP100 #67 - failing on it would turn every
          # upstream Yahoo outage red). The asserts below could not see that
          # decision. All they saw was "<market>_vivek.json has no staged diff",
          # byte-identical to the 2026-07-20 silent-staging bug they exist to
          # catch - so a blocked feed failed the whole cycle and mailed a red
          # run for an outage nobody can fix.
          #
          # run.py names exactly those markets in .scan-skipped
          # (scanner/config.py SCAN_SKIP_MARKER; untracked, appended once per
          # skipping process, fresh per checkout). That file is the
          # DISCRIMINATOR this gate was missing - and a discriminator is the
          # point: swallowing the failure instead would also swallow the
          # difference between "decided to publish nothing" and "silently
          # published nothing", which is how a gate gets deleted rather than
          # fixed. Markets named there warn; every market that CLAIMED to scan
          # is still gated exactly as hard as before.
          SKIPPED=""
          if [ -f .scan-skipped ]; then
            SKIPPED=$(tr -d '\r' < .scan-skipped | tr '\n' ' ')
            echo "::warning::source fully blocked for: ${SKIPPED}- previous JSON kept, must-change gate advisory for those markets only"
          fi
          skipped() { case " $SKIPPED " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            for m in $MK; do
              if skipped "$m"; then
                echo "::warning::${m}: no data downloaded and no cache to fall back on - scan deliberately published nothing, so ${m} data is UNCHANGED from the previous run. Not a staging failure."
              elif [ "$m" = "crypto" ] && [ "$M" = "all" ]; then
                bash scripts/assert_staged.sh "scan output [crypto]" \
                  "public/data/crypto_vivek.json" \
                  || echo "::warning::crypto scan output not staged - best-effort leg of a full cycle"
                bash scripts/assert_staged.sh "bot book [crypto]" \
                  "journal/vivek_bot_book.crypto.json" \
                  || echo "::warning::crypto book not staged - best-effort leg of a full cycle"
              else
                bash scripts/assert_staged.sh "scan output [$m]" "public/data/${m}_vivek.json"
                bash scripts/assert_staged.sh "bot book [$m]" "journal/vivek_bot_book.${m}.json"
              fi
            done
            # The combined books are re-stamped by _write_combined() whenever ANY
            # market's bot layer runs, so a PARTIAL skip must still gate hard -
            # the markets that did scan are obliged to move them, and that is the
            # case the 2026-07-20 bug actually looked like. Only a cycle where
            # EVERY market skipped leaves them legitimately untouched.
            ALL_SKIPPED=1
            for m in $MK; do skipped "$m" || ALL_SKIPPED=0; done
            if [ "$ALL_SKIPPED" = "1" ]; then
              echo "::warning::every market this cycle ($MK) published nothing - the bot layer never ran, so the combined books are unchanged too. Not a staging failure."
            else
              bash scripts/assert_staged.sh "combined book (journal)" journal/vivek_bot_book.json
              bash scripts/assert_staged.sh "combined book (public twin)" public/data/vivek_bot_book.json
            fi
          else
            bash scripts/assert_staged.sh "scan output (manual)" journal/vivek_bot_book.json \
              || echo "::warning::book not staged (manual run - dry-run or test args?)"
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)
          # Re-apply OUR generated files onto the freshest main and push. Safe
          # because $PATHS is surgical (see above): everything listed is written
          # only by scan-group workflows, which serialize — so this run's copy of
          # each listed file is always the newest. Retry in case a push races.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              # TOP100 #42 — only ever REPLACE a path this run actually
              # generated. The old form ran `git rm` unconditionally and then
              # let the checkout fail silently into `|| true`, so any path
              # present on the freshly-fetched main but ABSENT from $SHA was
              # deleted, staged by the `git add -A` below, and pushed. Nothing
              # in the loop could tell that apart from an intentional delete.
              # It is not hypothetical: several listed paths exist only
              # sometimes (the unassigned book is written only when migration
              # finds strays), and every workflow in the scan group re-applies
              # its own list on top of a main that a sibling may have just
              # written — so the loop written to survive a push race could
              # lose one instead. If $SHA does not have it, this run did not
              # generate it, so main's copy is the newer one: leave it.
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            # The COMBINED book is a DERIVED file shared by every scan-group
            # workflow (2026-07-20 evening incident): a run queued on an OLD
            # checkout that loses the push race re-applies its STALE combined
            # over marks a fresher run just committed (canonical per-market
            # files stay correct; only the derived view diverges until the
            # next run). Regenerate it from the CURRENT tree instead of
            # trusting this run's snapshot.
            python -m scanner.broker.vivek_run --rebuild-combined
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1

      # If anything above failed, say so — otherwise the site quietly serves
      # stale data and nobody notices until the freshness badge goes orange.
      - name: Alert on failure (Discord)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "No webhook configured - skipping."; exit 0; }
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"WARNING: **${{ github.workflow }}** run FAILED - scan data may be going stale. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true
