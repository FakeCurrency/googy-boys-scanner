name: Backup bot book

# Nightly safety net for journal/vivek_bot_book.json — the system's ONLY track
# record (2026-07-20, review C2). Snapshots the journal/state files into
# backups/<timestamp>/ via scripts/backup_journal.py and commits ONLY that new
# backup directory — it never touches public/data or the live journal files,
# so it cannot clobber a concurrent scan's outputs. Restore path:
#   python scripts/backup_journal.py list
#   python scripts/backup_journal.py restore <backup-dir>

on:
  # SCHEDULE RE-REGISTRATION (2026-07-30): the scheduler stopped creating runs
  # for EVERY cron in this repo after ~01:15 UTC — the same window in which
  # GitHub's ref backend was erroring (crypto_bot #255, "fatal error in
  # commit_refs"). This touch re-registers all schedules (2026-07-24 precedent).
  schedule:
    # Daily 21:35 UTC — right after the 21:00 NASDAQ-close scan has committed,
    # so each night's snapshot captures that day's final book. Runs weekends
    # too (the crypto book updates 24/7).
    - cron: "35 21 * * *"
    # BACKSTOP (2026-08-27): on 2026-08-26 the scheduler dropped the 21:35
    # firing ENTIRELY — no run of any conclusion — in the same 21:00–23:00
    # window that delayed evidence_brief 3h and dropped alert_returns too
    # (the 2026-07-24/07-30 drops were the same class). The gate below skips
    # this cron when a snapshot from on/after the latest 21:00Z slot already
    # exists in the checkout (the slot, not the UTC date - see the gate), so a
    # healthy scheduler costs zero extra snapshots and a ghosted 21:35 is
    # healed within two hours instead of aging into a silent hole.
    - cron: "35 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Own group (not "scan"): a queued backup must never be displaced from the
# shared scan queue and silently skipped. Push races are handled below —
# this workflow only ADDS files under backups/, so a rebase is always clean.
concurrency:
  group: backup-book
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The backstop cron's freshness gate — LOCAL, off the fresh checkout:
      # snapshots are committed in-tree as backups/<UTC-timestamp>/, so
      # "did the 21:35 slot land" is one ls. Fail-open: an unreadable dir
      # reads as no-snapshot and the backstop runs (an extra snapshot is
      # cheap; a missing one is the failure this cron exists to prevent).
      #
      # It asks about the CRON SLOT, not the UTC calendar day (2026-10-05).
      # Both crons fire hours late, so the 21:35 primary now usually lands
      # after 00:00Z. A "today's date" match then read the PREVIOUS cycle's
      # snapshot as tonight's (a dropped primary + an on-time backstop would
      # have skipped, leaving a ~48h hole), and a primary landing before
      # midnight was missed by a backstop after it (two snapshots a night,
      # 09-05..09-28, halving BACKUP_KEEP's depth). SLOT is the most recent
      # SLOT_H:00Z at or before now (Unix days are exact UTC days); skip only
      # when the newest snapshot is at or after it. The names are fixed-width
      # UTC stamps, so byte order (LC_ALL=C sort) is time order.
      # Executed against a faked clock in tests/test_backup_completeness.py.
      - id: gate
        name: Backstop freshness gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          SLOT_H=21   # the primary cron's UTC hour: "35 21 * * *" above
          run=true
          if [ "$SCHEDULE" = "35 23 * * *" ]; then
            NOW=$(date -u +%s)
            SLOT=$(( (NOW - SLOT_H * 3600) / 86400 * 86400 + SLOT_H * 3600 ))
            ANCHOR=$(date -u -d "@$SLOT" +%Y-%m-%dT%H-%M-%S)
            NEWEST=$(ls backups 2>/dev/null \
              | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}$' \
              | LC_ALL=C sort | tail -n 1) || NEWEST=""
            LATER=$(printf '%s\n' "$ANCHOR" "$NEWEST" | LC_ALL=C sort | tail -n 1)
            if [ -n "$NEWEST" ] && [ "$LATER" = "$NEWEST" ]; then
              echo "Backstop - snapshot $NEWEST is at/after the $ANCHOR slot. Skipping."
              run=false
            else
              echo "Backstop - newest snapshot (${NEWEST:-none}) predates the $ANCHOR slot. Running."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # backup_journal.py is stdlib-only — no pip install needed.
      - name: Create timestamped backup
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/backup_journal.py backup

      # Off-tree copy (2026-07-21): the snapshot committed below lives in the
      # SAME repo as the book it protects — a bad force-push / repo corruption
      # would take the record AND its backups together. This uploads the whole
      # backups/ set as a run artifact (90-day retention) so a copy always
      # exists OUTSIDE the git tree. Restore: Actions → this workflow → pick a
      # run → download the artifact, unzip, then
      #   python scripts/backup_journal.py restore <backup-dir>
      - name: Upload snapshots as run artifact (off-tree copy)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: book-backups-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error

      - name: Commit backup (surgical — only the new backups/ dir)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A so retention PRUNING deletions (backup_journal.py keeps the
          # newest N) are staged too, not just new snapshot dirs.
          git add -A backups
          # Must-change gate (2026-07-20 Phase 5): every run creates a NEW
          # timestamped dir under backups/ — empty staging here can only mean
          # the backup was silently lost. Fail loudly (red run + GitHub's email).
          bash scripts/assert_staged.sh "book backup" backups
          if git diff --cached --quiet; then
            echo "Nothing to back up."
            exit 0
          fi
          git commit -m "backup: journal state $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — rebase and retry $i"
            git pull --rebase origin main || true
            sleep $((i * 3))
          done
          echo "Could not push backup after retries"; exit 1

      # TOP100 #50 (2026-07-28) — the gate above proves a DIRECTORY appeared.
      # It cannot see what is IN it, so a path quietly dropped from
      # BACKUP_FILES, or a source file gone from the tree (backup() prints
      # "skip (not found)" and carries on), left this job green and surfaced at
      # restore time — the one moment nothing can be done about it. This checks
      # every REQUIRED_FILES entry is present, non-empty and parseable.
      #
      # DELIBERATELY LAST, after the commit and push. A verification step that
      # runs first and fails destroys the thing it was verifying: the snapshot
      # would never be committed and the off-tree artifact never uploaded, so
      # the response to "tonight's backup is incomplete" would be to also not
      # keep the incomplete one. An incomplete backup still beats none. The
      # job goes red either way (GitHub's red-run email is the alarm).
      - name: Verify the snapshot contains the track record
        run: python3 scripts/backup_journal.py verify

