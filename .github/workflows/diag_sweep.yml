# THROWAWAY production smoke (2026-09-23 sweep, S1). Runs only on a push to
# its own branch, never on main. Read-only GETs of the public site; PASS/FAIL
# results and screenshots are committed to THIS branch only.
name: diag sweep smoke (throwaway)
on:
  push:
    branches: [diag-sweep-2026-09-23]
    paths: ["diag/sweep_audit.js", ".github/workflows/diag_sweep.yml", "diag/kick"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Smoke production (read-only)
        timeout-minutes: 9
        run: node diag/sweep_audit.js || true
      - name: Commit results to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/sweep
          git commit -q -m "diag: sweep smoke results $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
          git push origin HEAD:diag-sweep-2026-09-23
