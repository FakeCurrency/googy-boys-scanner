# THROWAWAY diagnostic (2026-09-23 nap run). Runs only on a push to its own
# branch, never on main. Read-only audit of the public site at 390x844; the
# PASS/FAIL results and screenshots are committed to THIS branch only.
name: diag ELS 4H (throwaway)
on:
  push:
    branches: [diag-els-4h-2026-09-23]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Audit production (read-only)
        timeout-minutes: 5
        run: node diag/nap_audit.js || true
      - name: Commit results to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/audit
          git commit -q -m "diag: nap audit results $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
          git push origin HEAD:diag-els-4h-2026-09-23
