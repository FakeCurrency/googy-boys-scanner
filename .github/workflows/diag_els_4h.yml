# THROWAWAY diagnostic (2026-09-23). Runs only on a push to its own branch,
# never on main. GETs the public price relay (read-only) and commits the raw
# bars to THIS branch so they can be analysed offline; nothing reaches main.
name: diag ELS 4H (throwaway)
on:
  push:
    branches: [diag-els-4h-2026-09-23]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the bars the Momentum chart requests (read-only GETs)
        run: |
          mkdir -p diag/data
          get() {
            curl -sS -m 60 -o "diag/data/$1" -w "$1 HTTP %{http_code} %{size_download}B\n" \
              "https://googy-boys-scanner.pages.dev/api/price?$2" || echo "$1 curl failed"
            sleep 2
          }
          get ELS_1h.json   "symbol=ELS.AX&range=2y&interval=1h"
          get ELS_1d.json   "symbol=ELS.AX&range=25y&interval=1d"
          get AAPL_1h.json  "symbol=AAPL&range=1mo&interval=1h"
          ls -la diag/data
      - name: Commit the fetched bars to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/data
          git commit -q -m "diag: fetched bars $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
          git push origin HEAD:diag-els-4h-2026-09-23
