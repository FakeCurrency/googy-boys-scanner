name: Morning plays (Discord)

# The daily HIGH-CONVICTION digest (scripts/morning_plays.py). Two market-
# specific slots, each ~30 min after its market's close (owner ask 2026-09-09):
#   * ASX             at 16:30 Melbourne (afternoon)
#   * NASDAQ + Crypto at 06:30 Melbourne (next morning)
# Each cron maps to a slot NAME (below); the script sends that slot when
# Melbourne is at/past its target time and it has not gone out today (config
# MORNING_PLAYS_SLOTS + a per-day marker). This is delay-proof: GitHub batched
# these crons 2-5 HOURS late on 2026-09-09 and the old hour-exact gate missed a
# whole day. "at/past" catches a late run; the marker stops the slot's second
# DST cron double-sending. Each slot delivers exactly once per day.
#
# READ-ONLY to the repo: it reads the COMMITTED scan JSON
# (public/data/<market>_vivek.json) and posts. It never scans, never touches
# Yahoo, never commits, and is NOT in the `scan` concurrency group -- so it
# needs no assert_staged and no WATCHDOG_RUNS entry (same as evidence_brief.yml,
# which also only reads + delivers). Its only state is a tiny actions/cache file
# (the 7-day de-dup sent-list), the same cross-run pattern as the watchdog
# state -- restored before the run, saved after, gitignored, never committed.
#
# THE CHANNEL IS NEW, NOT A REVIVAL. Discord as an ALERT channel was removed
# 2026-08-27; this uses its OWN secret (DISCORD_MORNING_WEBHOOK_URL), which is
# the sanctioned path the credential pins name for "something new". Until the
# owner creates the webhook and sets that secret, the script warns loudly and
# exits 0 (a green setup gap).
#
# THE POST-CLOSE DATA GATE (2026-09-11). On-time was not enough: the first
# on-time 06:35 US run read a 1:43pm New York MID-SESSION scan (scan.yml's
# post-close scan committed at 07:06 Melbourne) and posted "nothing new" while
# three names had set up in the last hours of trade. The script now sends a slot
# only once the market's committed scan was GENERATED after the session close
# (config.MORNING_PLAYS_SLOT_GATE), marking nothing until then. So the triggers
# are a LADDER OF ATTEMPTS after the close scans, not a single wall-clock time:
# the first post-close attempt sends, the per-day marker silences the rest.
#
# The gate also refuses while the session the slot OWES is still running (open
# per config.VIVEK_JOURNAL_SESSION .. the close above, for the session open at
# the slot's floor): under AEDT+EST the US slot's 06:30 Melbourne floor is 14:30
# New York, and a mid-session list used to pass against YESTERDAY's close and
# mark the slot done. A session that opens after the floor (AEST+EDT: 23:30
# Melbourne = 09:30 New York) is the next slot's and does not hold this one.
#
# The close scans these follow (scan.yml, read in each market's own zone):
#   ASX closing scan     16:30 Sydney   = 05:30 UTC (AEDT) / 06:30 UTC (AEST)
#   NASDAQ post-close    16:07 New York = 20:07 UTC (EDT)  / 21:07 UTC (EST)
#
# The ON-TIME delivery is the external cron-job.org ladder (cron-job.org's
# timezone set to UTC; Mon-Fri; see functions/api/morning_plays.js):
#   ASX  06:15..10:45 UTC every 30 min = 16:15..20:45 AEST / 17:15..21:45 AEDT
#        (16:15 AEST is before the 16:30 floor -> no-op)
#   US   20:15..23:45 UTC every 30 min = 06:15..09:45 AEST / 07:15..10:45 AEDT
#        = 16:15..19:45 EDT / 15:15..18:45 EST in New York (06:15 AEST is before
#        the floor; 15:15/15:45 EST are mid-session -> the gate waits)
#
# The crons below are GitHub's own backstop -- when the ladder has delivered,
# they no-op. Local times by regime (Melbourne = Sydney all year):
#   50 5  UTC  ASX  15:50 AEST (before the floor) / 16:50 AEDT
#   50 6  UTC  ASX  16:50 AEST                     / 17:50 AEDT
#   50 7  UTC  ASX  17:50 AEST                     / 18:50 AEDT
#   50 8  UTC  ASX  18:50 AEST                     / 19:50 AEDT
#   50 21 UTC  US   07:50 AEST / 08:50 AEDT; 17:50 EDT / 16:50 EST New York
#   50 22 UTC  US   08:50 AEST / 09:50 AEDT; 18:50 EDT / 17:50 EST New York

on:
  schedule:
    # ASX. The closing scan moved to 16:30 market-local on 2026-09-21 (owner:
    # "make the last scan 16:30 then trigger the discord to send shortly there
    # after"), which is 05:30 UTC under AEDT and 06:30 under AEST — so :50 in
    # BOTH those hours is ~20 min after it commits, and the wrong-regime one is
    # a silent no-op (the post-close data gate refuses a pre-close scan). The
    # 07/08 slots stay as late backstops for a dropped cron.
    - cron: "50 5 * * 1-5"    # ASX, ~20 min after the 16:30 AEDT closing scan
    - cron: "50 6 * * 1-5"    # ASX, ~20 min after the 16:30 AEST closing scan
    - cron: "50 7 * * 1-5"    # ASX backstop
    - cron: "50 8 * * 1-5"    # ASX backstop, an hour later
    # US. After the 16:07 New York post-close scan in either regime (20:07 UTC
    # under EDT, 21:07 UTC under EST): 17:50 EDT / 16:50 EST New York.
    - cron: "50 21 * * 1-5"   # NASDAQ+Crypto backstop
    - cron: "50 22 * * 1-5"   # NASDAQ+Crypto backstop, an hour later
  workflow_dispatch:
    inputs:
      slot:
        description: "Run ONE slot now as if scheduled: delivers it AND marks it sent, so today's late cron won't repeat it. Blank = send all markets (force)."
        type: choice
        options: ["", "asx", "us"]
        default: ""
        required: false
      force:
        description: "(only when slot is blank) send ALL markets now regardless of hour"
        default: "true"
        required: false
      redeliver:
        description: "(only with slot) re-send the slot even though it already went out today; dedup + state still apply"
        default: "false"
        required: false

permissions:
  contents: read

concurrency:
  group: morning-plays
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The 7-day de-dup memory. Cross-run ephemeral state, never committed --
      # a unique key always writes a fresh entry; the restore-keys prefix pulls
      # the most recent one back. Accessed twice a day, so it never ages out.
      - name: Restore the sent-list (de-dup memory)
        uses: actions/cache@v4
        with:
          path: .cache/morning_plays_sent.json
          key: morning-plays-sent-${{ github.run_id }}
          restore-keys: |
            morning-plays-sent-

      # stdlib-only: the script reads committed JSON and scanner.config (pure
      # constants, no pandas), so no pip install is needed.
      - name: Post the morning digest
        env:
          # The channel's own secret -- deliberately its own distinct name, not
          # the removed alert webhook secret. Absent = the script warns + exits 0.
          DISCORD_MORNING_WEBHOOK_URL: ${{ secrets.DISCORD_MORNING_WEBHOOK_URL }}
          # Free-text/boolean inputs travel through env, never ${{ }} inside a
          # run block (2026-07-20 security pass).
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          SLOT_INPUT: ${{ github.event.inputs.slot }}
          REDELIVER: ${{ github.event.inputs.redeliver }}
          # Which cron fired -- maps to a slot NAME below. Never interpolate a
          # ${{ }} value inside the run script (2026-07-20 security pass); read
          # the env var instead.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$SLOT_INPUT" ]; then
              ARGS="--slot $SLOT_INPUT"          # run one slot as if scheduled (writes state)
              if [ "$REDELIVER" = "true" ]; then ARGS="$ARGS --redeliver"; fi
            elif [ "$FORCE" != "false" ]; then
              ARGS="--force"                     # manual test: send all markets now
            else
              echo "morning_plays: dispatch with no slot and force=false - nothing to do."
              exit 0
            fi
          else
            case "$SCHEDULE" in
              "50 5 * * 1-5"|"50 6 * * 1-5"| \
              "50 7 * * 1-5"|"50 8 * * 1-5")   ARGS="--slot asx" ;;   # after the ASX closing scan
              "50 21 * * 1-5"|"50 22 * * 1-5") ARGS="--slot us"  ;;   # after the NASDAQ post-close scan
              *) echo "morning_plays: unmapped schedule '$SCHEDULE' - no-op."; exit 0 ;;
            esac
          fi
          python3 scripts/morning_plays.py $ARGS 2>&1 | tee /tmp/mp.txt

      - name: Step summary
        if: always()
        run: |
          {
            echo '### Morning plays'
            echo '```'
            cat /tmp/mp.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
