# THROWAWAY production smoke (validate 2026-09-23, V2). Runs only on a push to
# its own branch, never on main. Read-only GETs of the public site; PASS/FAIL
# results and screenshots are committed to THIS branch only.
name: diag validate smoke (throwaway)
on:
  push:
    branches: [diag-validate-2026-09-23]
    paths: ["diag/validate_smoke.js", ".github/workflows/diag_validate.yml", "diag/kick"]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Smoke production (read-only)
        timeout-minutes: 14
        env:
          PROBE_BASE: ${{ vars.PROBE_BASE || 'https://googy-boys-scanner.pages.dev' }}
        run: node diag/validate_smoke.js || true
      - name: Commit results to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/validate
          git commit -q -m "diag: validate smoke results $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
          git push origin HEAD:diag-validate-2026-09-23
