# Display name says CI so a failure email ("Run failed: Code checks (CI)")
# can never be misread as a scanner/pipeline outage — owner order 2026-08-15.
# The scan pipeline is scan.yml / crypto_bot.yml / close_position.yml etc.;
# this workflow only gates code pushes. File name stays test.yml.
name: Code checks (CI)

# The gate that was missing: the Python tests (risk rules, circuit breakers,
# journal P&L, pre-trade gate) + PhaseMap tests + the JS risk-engine tests
# existed but NOTHING ran them — regressions only surfaced when they broke a
# scheduled scan (e.g. the 2026-07-05 schema-gate failure). Now every push
# runs the lot in ~2 minutes: 1255 pytest (58 files) + 650 JS assertions across
# 16 suites, measured 2026-07-29. The numbers are a smell test, not a gate —
# a big drop means a directory stopped being collected, which is the failure
# `pytest.ini` being in the path filter above exists to make visible.
on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "phasemap/**"
      - "tests/**"
      - "test/**"
      - "public/js/**"
      - "functions/**"
      - "requirements.txt"
      # TOP100 #48 — four paths the suites READ but the filter did not list, so
      # editing any of them shipped to production with the gate skipped. A
      # skipped gate is not a red run you can ignore, it is a green tick on a
      # commit nothing checked.
      #
      #   scripts/**   4 pytest files import it (resize_book_notional,
      #                backfill_sector_history, reco_note, health_check) — and
      #                resize_book_notional is the one that RESTATES the track
      #                record, whose tests are almost entirely about what it
      #                refuses to do.
      #   pytest.ini   decides what gets collected at all. An edit here can
      #                silence whole directories, and the run that proves it
      #                would never start.
      #   public/css/**   test/contrast.test.js gates the design tokens in
      #                styles.css; journal_review.test.js reads journal.css.
      #   public/*.html   risk_defaults.test.js parses bot.html as source, and
      #                journal_money.test.js enforces the `?v=` floor on
      #                journal.html — i.e. project rule 2 (bump the version on
      #                every asset edit) was enforced by a suite that did not
      #                run when the edit was to the HTML. The e2e job serves
      #                public/ wholesale, so these pages are what it walks.
      #
      #
      # Two more added 2026-08-13, same rule, and the sw.js one was a hole
      # before its test existed: `public/js/**` does NOT cover `public/sw.js`
      # (it sits at the public/ root), so every edit to the SERVICE WORKER —
      # the thing that decides what is cached, for how long, and whether a
      # deploy is even visible to an open tab — shipped with this whole gate
      # skipped.
      #
      #   public/sw.js        tests/test_version_stamp.py reads its CACHE name
      #   public/version.json tests/test_version_stamp.py IS the stamp gate
      #
      # public/data/** stays OUT deliberately: every scan commits it ~20x a day
      # and each run would pay a full Playwright install to re-test code that
      # did not change.
      - "scripts/**"
      - "pytest.ini"
      - "public/css/**"
      - "public/*.html"
      - "public/sw.js"
      - "public/version.json"
      # journal/** and data/** added 2026-08-13 — the same rule, and the
      # journal one is the sharpest hole this filter has had. THREE live tests
      # read the track record out of the working tree:
      #   tests/test_phase7.py:13                snapshots journal/alert_state.json
      #   tests/test_resize_book_notional.py:308 globs journal/vivek_bot_book.*.json
      #                                          and asserts every stop only ever
      #                                          moved favourably — on the LIVE book
      #   tests/test_backup_completeness.py:85   asserts 8 journal/* and 3 data/*
      #                                          paths exist in the checkout
      # journal/ is committed by six workflows and holds the only track record,
      # so an edit or a loss there could ship with this entire gate skipped.
      - "journal/**"
      - "data/**"
      # ALL workflows, not just this one (2026-07-28): tests/test_workflow_mutex.py
      # asserts on the concurrency scoping and the close re-dispatch, so the very
      # edits it exists to catch — a `concurrency:` block moved back up to
      # workflow level, a renamed `name:` that empties the wait-loop filter —
      # are edits to files that used to skip this gate entirely.
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

# TOP100 #56 (2026-07-28) — this was the ONE workflow in the repo with no
# permissions block, so its token was whatever the repository default happens
# to be, which for a repo created before the read-only default (or switched
# since) is read AND write. It is also the workflow with the widest trigger
# surface — every push and every pull_request — and the only one that runs
# third-party-authored code paths under test. It reads the tree and writes
# nothing but artifacts, so it should never have been able to push.
#
# `actions: read` is not needed (nothing here calls the Actions API) and is
# deliberately omitted; upload-artifact works under the default job token
# without it.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest (scanner risk/breaker/journal/pretrade + phasemap)
        run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every shipped script
        run: |
          set -e
          for f in public/js/*.js; do node --check "$f"; done
      - name: Risk-engine tests (65)
        run: node test/risk_manager.test.js
      - name: Unit tests (67)
        run: node test/unit.test.js
      - name: Cloud-watcher VIVEK parity tests (21)
        run: node test/vivek_manage.test.js
      - name: SWR cache-layer tests (#97)
        run: node test/cache.test.js
      - name: Design-token contrast gate (#96)
        run: node test/contrast.test.js
      - name: Freshness-probe tests (/api/health per-market mode)
        run: node test/health.test.js
      - name: Self-heal tests (/api/heartbeat per-market mode)
        run: node test/heartbeat.test.js
      - name: Journal review-chip tests (heavy-position flag)
        run: node test/journal_review.test.js
      - name: Journal stale-mark tests (cached-frame age, TOP100 #24)
        run: node test/journal_stale.test.js
      - name: Risk-default + size-calculator drift gate (TOP100 #34/#35, 20)
        run: node test/risk_defaults.test.js
      - name: Journal money-path tests (TOP100 #25/#26/#30/#33, 22)
        run: node test/journal_money.test.js
      - name: HTML-escaping contract across public/js (TOP100 #75/#76/#77, 203)
        run: node test/escaping.test.js
      - name: Stale-payload + racing-poll + cold-fail + timeout + book-strip + funnel-trend + v5-split rules (TOP100 #78/#79, 42)
        run: node test/staleview.test.js
      - name: Leak + backoff rules (TOP100 #80/#81/#82/#83 + sync honesty, 52)
        run: node test/leaks.test.js
      - name: Derived-state + fault-scoping rules (TOP100 #84-#88, 55)
        run: node test/statekeep.test.js
      - name: Stalled-position decision surface (read-only, probe marks only)
        run: node test/stalled.test.js
      - name: What-needs-my-eyes confluence strip (ranking + wiring)
        run: node test/eyes.test.js
      # Runs in the CHEAP job on purpose. It exercises the baseline-provenance
      # sentinel out of the e2e file without a browser, so the rule that keeps
      # the screenshot gate from going red on a stale baseline is checked on
      # every push in ~50ms rather than behind a Playwright install.
      - name: Screenshot baseline-provenance sentinel (out of band, 14)
        run: node test/screenshot_sentinel.test.js
      # The four state-touching Pages Functions' guard rails (out of band,
      # 2026-07-29): journal sync limiter can't lock out its own polling, the
      # scan/close cooldowns refund on a failed dispatch, and the tick watcher
      # prices crypto as <base>-USD (a bare base is a same-named EQUITY).
      - name: API guard rails (journal limiter / dispatch refunds / tick pricing, 17)
        run: node test/api_guards.test.js
      # Endpoint access log (2026-08-20): the three unauthenticated endpoints
      # write who-called-me envelopes to KV for incident diagnosis. Two pinned
      # properties: a call gets logged, and a KV failure never blocks the
      # underlying close/scan/journal action.
      - name: Access log (logged calls / best-effort / coalesced polling, 13)
        run: node test/access_log.test.js
      # Sector-cap deck marking (2026-08-20): sectorKeyOf mirrors the bot's
      # _sector_key bucketing and the chip mirrors decide()'s sector_cap skip,
      # so the display can never disagree with what actually blocks a trade.
      - name: Sector-cap marking (bucket parity / chip rules / wiring, 14)
        run: node test/sector_cap.test.js
      # Breadth stretch (batch-100 WS-E): the percentile the regime surfaces
      # print is midrank-exact — a `<=` rank painted a flat tape STRETCHED.
      - name: Regime breadth-stretch (midrank percentile / silence rules, 6)
        run: node test/regime_stretch.test.js
      # STATUS control (2026-08-19, Session 1). The lamp is the only surface
      # that claims the system is healthy, so two of its promises are gated
      # here rather than remembered: it issues GET requests to published files
      # and /api/health ONLY (never the healer, which dispatches a scan when it
      # is polled), and its uptime figure is clamped to the span of the ledger
      # it is derived from instead of counting the dark before the ledger
      # existed as healthy.
      - name: Status control (read-only promise / uptime clamp / states matrix, 48)
        run: node test/status.test.js

  # Browser-level smoke (UI backlog #8, 2026-07-22): serves public/ and walks
  # the daily flows — deck paint, pill filtering, row expand + ladder, sort
  # control, recs page, and a 390px overflow/price check — against the
  # committed scan data, failing on any uncaught page error.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ONE consolidated install (2026-07-25): npm's --no-save installs can
      # PRUNE previously-installed packages that aren't in package.json — the
      # old per-step installs (playwright here, lighthouse later, pixelmatch
      # later still) had the last install evicting an earlier module, and the
      # screenshot-diff step died on a missing require (run #77). Installing
      # everything in one command removes the prune hazard entirely.
      - name: Install Playwright + Chromium + tool deps
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright lighthouse chrome-launcher pixelmatch pngjs > /dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: E2E smoke (dashboard + recs · desktop + 390px)
        run: node test/e2e/smoke.e2e.js
      # Hang-probe (owner-ruled, 2026-07-31): a data fetch that neither
      # resolves nor rejects — the one failure mode Phase B exists for, and
      # the one no unit test can exercise. The probe HOLDS the deck's market
      # payload request open (Playwright route, never fulfilled) and asserts
      # the 20s abort really fires in a real browser, the "Tap to retry"
      # state appears wired, and the page stays usable mid-hang (market
      # switch paints fixture rows while the hung request is still pending).
      # ~70s of genuine wall-clock waiting is the point: the timeout under
      # test is real, not mocked. Test-only — production fetch logic is
      # untouched, and /data/ is fixture-pinned like the two gates below, so
      # this can never fail on a quiet live tape.
      - name: Hang-probe (hung fetch -> timeout -> Tap to retry)
        run: node test/e2e/hangprobe.e2e.js
      # Mobile screenshot matrix (#40): 6 pages x 360/390/430, asserts zero
      # overflow and uploads the shots so mobile layout is reviewable per run.
      - name: Mobile screenshot matrix (360/390/430)
        run: node test/e2e/screenshots.e2e.js
      # Lighthouse budget tripwire (#70): fails ONLY on an egregious layout-
      # stability or payload regression (CLS < 0.50, transfer < 1.7MB — the
      # payload-diet lock-in: un-splitting v5 reads ~1.86MB and goes red). TTI is
      # printed but NOT gated — it swings ~2x on shared runners and a flaky
      # perf gate would just resurrect the failure-email problem. Reuses the
      # chromium Playwright already installed above (no second browser download).
      # SERVES A FIXTURE-PINNED ROOT (2026-07-28): /data/ is test/e2e/fixtures/
      # data, the same set screenshot-diff routes to. It used to serve public/
      # wholesale, which meant the transfer budget was measuring the live scan
      # JSON and went red whenever the ASX had a broad day — on whatever
      # unrelated code push landed next. The REAL payload is printed every run
      # and warns past 7MB, but can never fail this step.
      - name: Lighthouse budget (CLS + transfer tripwire)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node test/e2e/lighthouse.e2e.js
      # Screenshot-diff gate (#98): fails on >2% visual drift, desktop + 390px.
      # Baselines are cached per-environment (CI-native rendering) so cross-env
      # font differences never false-fail; first run self-baselines and passes,
      # later runs diff. Bump the cache key to accept an intentional visual change.
      #
      # v10 -> v11 (2026-07-28) is NOT an intentional visual change, and the ten
      # bumps before it were not either. THIS GATE HAS BEEN THE RECURRING FAILURE
      # EMAIL. The runner clock was reaching the page, so the journal shots
      # re-rendered themselves against a baseline that — deliberately — never
      # re-saves. Measured with /data/ pinned to fixtures so the CLOCK was the
      # only variable: journal-desktop steps to 2.39% drift the moment its cached
      # baseline is two days old, and stays there (2.39% at 2, 3, 5 and 7 days —
      # a day-bucket boundary, not slow decay), against a 2% budget.
      #
      # `actions/cache@v4` on an exact key persists and refreshes on access, so
      # "two days old" is not a phase, it is permanent: once past it EVERY later
      # run fails until the key moves. That is what nine bumps were doing — each
      # re-cut the baseline, bought a day, and went red again. The clock is now
      # frozen in screenshot-diff.e2e.js, so the baseline's AGE stops being an
      # input at all.
      #
      # The fixture digest in the key is the other half. FROZEN_MS is derived
      # from the fixtures, so refreshing them MOVES the clock and repaints every
      # relative-time row at once. With the digest, that cuts a fresh cache entry
      # which self-baselines and SAVES; without it the run would lean on the
      # script's `.clock` sentinel, which discards and re-cuts but cannot save
      # (cache@v4 does not re-save on a key hit), leaving the gate green but
      # comparing nothing until a human bumped the version. Cost, stated plainly:
      # a commit that refreshes fixtures AND changes the UI has its visual diff
      # skipped for one run. That is the same trade the sentinel makes, and it is
      # the right way round — an unreviewed run beats an unactionable red.
      #
      # NO `restore-keys`, ever: a prefix fallback would restore the very
      # baseline a bump exists to discard.
      - name: Restore screenshot baselines
        uses: actions/cache@v4
        with:
          path: test/e2e/__baseline__
          # v11 -> v12 (2026-07-30): INTENTIONAL visual change — the deck's bot
          # strip became the paper-book scoreboard (owner-ordered): market
          # split + unrealized R + closed record + the stall-probe line. The
          # diff was eyeballed before this bump: one new element, everything
          # below shifts one line, nothing else moved.
          #
          # v14 -> v15 (2026-08-13): INTENTIONAL, owner-ordered, and MEASURED
          # rather than assumed — the baseline was cut from origin/main and the
          # working tree diffed against it before this bump:
          #   index-desktop 0.25%  ·  index-390 2.42%  ·  journal both 0.00%
          # Only index-390 exceeds the 2% budget, and it is reflow, not
          # breakage: the deck strip now leads with capacity ("24 of 30 slots ·
          # 0 stalled · 6 free"), which wraps to a third line at 390px and
          # pushes the pills row down. Verified alongside: zero horizontal
          # overflow at 360/390/430, smoke green, no page errors. The A+ pill
          # also renumbered (products no longer counted as opportunity), which
          # changes glyph widths on both index shots.
#
          # v15 -> v16 (2026-08-15): INTENTIONAL and measured — the deck rows
          # now carry a HELD chip for names the paper bot already holds, and
          # the e2e fixture book overlaps the fixture scan heavily, so many
          # rows reflow: index-desktop 2.22%, index-390 2.69% against the 2%
          # budget; journal both 0.00% (the new w3-1 and decider lines stay
          # silent on fixture data by design — no stamps, single-reason mix).
#
          # v16 -> v17 (2026-08-17, Lane A cockpit pass): INTENTIONAL and
          # measured against the pre-change baselines BEFORE this bump —
          # index-desktop 2.80%, index-390 3.80%, journal-390 2.53% against the
          # 2% budget; journal-desktop 0.65% (inside it). Four display changes
          # account for it: products now queue below real names inside each
          # grade so the deck's first screenful reorders wholesale; the
          # duplicate FUNDS DIMMED toolbar chip and the "N tradeable" pill are
          # gone while the products chip gained a "· dimmed/shown" state; the
          # JOURNAL tab badge turned blue; and the false first-visit "Update
          # ready" toast — which was BURNED INTO the v16 baselines — no longer
          # paints, so part of the index-390 and journal-390 drift is that
          # toast leaving the picture.
          #
          # SEQUENCING, and it corrects the folk rule this repo has twice been
          # burned by. "Bump the key BEFORE the visual change" is wrong when
          # the two land as separate commits: a bump-only commit cuts fresh
          # baselines of the OLD look, and the next commit then compares the
          # new UI against them and goes red anyway. cache@v4 saves only on a
          # MISS, so the ONLY sequence that is green at every step is the key
          # moving in the same commit as the visuals — and per-directory web
          # uploads cannot span public/js, public/css and .github/workflows in
          # one commit. So this train lands the visual commits, then this bump,
          # and the bump's own run is the one that re-cuts and goes green.
          # Expect the intermediate runs to fail on drift; that is the design,
          # not a regression, and the run AFTER this key moves is the proof.
#
          # v17 -> v18 (2026-08-18, journal condensation pass): INTENTIONAL and
          # measured against the pre-change baselines BEFORE this bump —
          # journal-desktop 3.04%, journal-390 4.20% against the 2% budget;
          # index-desktop 0.34% and index-390 0.80% stay inside it (the deck
          # only gained group separators and two border-colour changes).
          #
          # The journal drift is the point of the pass: the four analytics
          # panels (478px) moved into one fold, the closed table now previews
          # 10 rows instead of rendering all 45 (1,884px -> ~450px), the
          # duplicated realised sparkline row left the header, the stalled
          # explainer became a tooltip, and the section headings gained a
          # dividing rule. Measured: 5,183px -> ~2,900px, with every number
          # still on the page.
          #
          # Sequencing per the v17 note: visual commits first, this bump last,
          # landed fast enough that concurrency cancels the intermediate runs.
          #
          # v19 (2026-08-19) — the STATUS lamp in the top bar. This one is a
          # HEADROOM bump, not a rescue: measured against the v18 baselines the
          # shipped control drifts index-desktop 0.03%, index-390 0.03%,
          # journal-390 0.05% and journal-desktop 1.76% — all four inside the 2%
          # budget, so the gate was green either way and no run had to be raced.
          # The bump is for the last of those: leaving 1.76% of permanent,
          # already-accepted drift baked into a 2% budget hands the next
          # unrelated change 0.24% of room on that view, which is how a gate
          # starts failing for reasons nobody can attribute. Re-baselining puts
          # journal-desktop back at ~0%.
          #
          # The three small numbers are themselves the result of two rounds of
          # measurement rather than luck: a 40px labelled chip wrapped
          # journal.html's 390px header onto a second row (+54px of page shift,
          # 6.20% drift) and a 34px one still grew it 3px (3.65%). At 30px on
          # phones the header height is byte-for-byte what it was and the drift
          # is 0.05%. Chrome that costs a page nothing is worth measuring for.
          key: screenshot-baselines-v20-${{ runner.os }}-${{ hashFiles('test/e2e/fixtures/data/*.json') }}
      - name: Screenshot-diff (desktop + 390px, <2% drift)
        run: |
          export PW_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node test/e2e/screenshot-diff.e2e.js
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: test/e2e/__diff__/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: test/e2e/__shots__/
          retention-days: 14
          if-no-files-found: warn
