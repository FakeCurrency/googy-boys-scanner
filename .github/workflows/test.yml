name: Tests

# The gate that was missing: the Python tests (risk rules, circuit breakers,
# journal P&L, pre-trade gate) + PhaseMap tests + the JS risk-engine tests
# existed but NOTHING ran them — regressions only surfaced when they broke a
# scheduled scan (e.g. the 2026-07-05 schema-gate failure). Now every push
# runs the lot in ~2 minutes: 576 pytest + 190 JS assertions as of 2026-07-28.
on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "phasemap/**"
      - "tests/**"
      - "test/**"
      - "public/js/**"
      - "functions/**"
      - "requirements.txt"
      # ALL workflows, not just this one (2026-07-28): tests/test_workflow_mutex.py
      # asserts on the concurrency scoping and the close re-dispatch, so the very
      # edits it exists to catch — a `concurrency:` block moved back up to
      # workflow level, a renamed `name:` that empties the wait-loop filter —
      # are edits to files that used to skip this gate entirely.
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest (scanner risk/breaker/journal/pretrade + phasemap)
        run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every shipped script
        run: |
          set -e
          for f in public/js/*.js; do node --check "$f"; done
      - name: Risk-engine tests (54)
        run: node test/risk_manager.test.js
      - name: Unit tests (67)
        run: node test/unit.test.js
      - name: Cloud-watcher VIVEK parity tests (21)
        run: node test/vivek_manage.test.js
      - name: SWR cache-layer tests (#97)
        run: node test/cache.test.js
      - name: Design-token contrast gate (#96)
        run: node test/contrast.test.js
      - name: Freshness-probe tests (/api/health per-market mode)
        run: node test/health.test.js
      - name: Journal review-chip tests (heavy-position flag)
        run: node test/journal_review.test.js
      - name: Journal stale-mark tests (cached-frame age, TOP100 #24)
        run: node test/journal_stale.test.js
      - name: Risk-default + size-calculator drift gate (TOP100 #34/#35, 20)
        run: node test/risk_defaults.test.js
      - name: Journal money-path tests (TOP100 #25/#26/#30/#33, 22)
        run: node test/journal_money.test.js

  # Browser-level smoke (UI backlog #8, 2026-07-22): serves public/ and walks
  # the daily flows — deck paint, pill filtering, row expand + ladder, sort
  # control, recs page, and a 390px overflow/price check — against the
  # committed scan data, failing on any uncaught page error.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ONE consolidated install (2026-07-25): npm's --no-save installs can
      # PRUNE previously-installed packages that aren't in package.json — the
      # old per-step installs (playwright here, lighthouse later, pixelmatch
      # later still) had the last install evicting an earlier module, and the
      # screenshot-diff step died on a missing require (run #77). Installing
      # everything in one command removes the prune hazard entirely.
      - name: Install Playwright + Chromium + tool deps
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright lighthouse chrome-launcher pixelmatch pngjs > /dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: E2E smoke (dashboard + recs · desktop + 390px)
        run: node test/e2e/smoke.e2e.js
      # Mobile screenshot matrix (#40): 6 pages x 360/390/430, asserts zero
      # overflow and uploads the shots so mobile layout is reviewable per run.
      - name: Mobile screenshot matrix (360/390/430)
        run: node test/e2e/screenshots.e2e.js
      # Lighthouse budget tripwire (#70): fails ONLY on an egregious layout-
      # stability or payload regression (CLS < 1.30, transfer < 5MB). TTI is
      # printed but NOT gated — it swings ~2x on shared runners and a flaky
      # perf gate would just resurrect the failure-email problem. Reuses the
      # chromium Playwright already installed above (no second browser download).
      - name: Lighthouse budget (CLS + transfer tripwire)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node test/e2e/lighthouse.e2e.js
      # Screenshot-diff gate (#98): fails on >2% visual drift, desktop + 390px.
      # Baselines are cached per-environment (CI-native rendering) so cross-env
      # font differences never false-fail; first run self-baselines and passes,
      # later runs diff. Bump the cache key to accept an intentional visual change.
      - name: Restore screenshot baselines
        uses: actions/cache@v4
        with:
          path: test/e2e/__baseline__
          key: screenshot-baselines-v10-${{ runner.os }}
      - name: Screenshot-diff (desktop + 390px, <2% drift)
        run: |
          export PW_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node test/e2e/screenshot-diff.e2e.js
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: test/e2e/__diff__/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: test/e2e/__shots__/
          retention-days: 14
          if-no-files-found: warn
