name: Close position (manual)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol (e.g. JST)"
        required: true
      direction:
        description: "long or short"
        required: true
        default: long
      market:
        description: "asx | nasdaq | crypto (swing) — leave blank for scalp"
        required: false
        default: ""
      price:
        description: "Exit price"
        required: true
      exit_date:
        description: "Exit date YYYY-MM-DD (leave blank for today UTC)"
        required: false
        default: ""
      journal_type:
        description: "swing or scalp"
        required: true
        default: swing

permissions:
  contents: write

concurrency:
  group: close-${{ github.event.inputs.symbol }}-${{ github.event.inputs.direction }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs pass through env vars, never ${{ }} inside run: — the runner does
      # not shell-interpolate env values, so a crafted input can't inject commands.
      - name: Close position in journal
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          DIRECTION: ${{ github.event.inputs.direction }}
          MARKET: ${{ github.event.inputs.market }}
          PRICE: ${{ github.event.inputs.price }}
          EXIT_DATE: ${{ github.event.inputs.exit_date }}
          JOURNAL_TYPE: ${{ github.event.inputs.journal_type }}
        run: |
          python -m scanner.journal \
            --close-manual \
            --symbol "$SYMBOL" \
            --direction "$DIRECTION" \
            --market "$MARKET" \
            --price "$PRICE" \
            --date "$EXIT_DATE" \
            --journal-type "$JOURNAL_TYPE"

      - name: Commit updated journal
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          DIRECTION: ${{ github.event.inputs.direction }}
          PRICE: ${{ github.event.inputs.price }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data journal/journal.json journal/scalp_journal.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit (position not found or already closed)."
          else
            git commit -m "journal: manual close $SYMBOL $DIRECTION @ $PRICE"
            git pull --rebase origin main
            git push
          fi
