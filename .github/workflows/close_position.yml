name: Close position (manual)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol (e.g. JST)"
        required: true
      direction:
        description: "long or short"
        required: true
        default: long
      market:
        description: "asx | nasdaq | crypto (swing) — leave blank for scalp"
        required: false
        default: ""
      price:
        description: "Exit price"
        required: true
      exit_date:
        description: "Exit date YYYY-MM-DD (leave blank for today UTC)"
        required: false
        default: ""
      journal_type:
        description: "bot (the paper bot book — the real track record), swing or scalp"
        required: true
        default: bot

permissions:
  contents: write

# Joined the "scan" group (2026-07-20, review C4): journal_type=bot WRITES the
# shared bot book, so a close must never run concurrently with a scan's
# load->modify->write cycle (the C1 invariant: one book writer at a time).
# Closes queue behind a running scan — expect up to ~15 min delay; correctness
# over speed for the only track record.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs pass through env vars, never ${{ }} inside run: — the runner does
      # not shell-interpolate env values, so a crafted input can't inject commands.
      - name: Close position in journal
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          DIRECTION: ${{ github.event.inputs.direction }}
          MARKET: ${{ github.event.inputs.market }}
          PRICE: ${{ github.event.inputs.price }}
          EXIT_DATE: ${{ github.event.inputs.exit_date }}
          JOURNAL_TYPE: ${{ github.event.inputs.journal_type }}
        run: |
          if [ "$JOURNAL_TYPE" = "bot" ]; then
            # The REAL close (review C4): edits journal/vivek_bot_book.json —
            # the one-and-only track record. Exits non-zero if no open
            # position matches, so a typo'd symbol fails loudly instead of
            # committing a no-op "success".
            python -m scanner.broker.vivek_run \
              --close "$SYMBOL" \
              --market "$MARKET" \
              --price "$PRICE" \
              ${DIRECTION:+--direction "$DIRECTION"} \
              ${EXIT_DATE:+--day "$EXIT_DATE"}
          else
            # Legacy journals (swing/scalp) — retained for the manual pages.
            python -m scanner.journal \
              --close-manual \
              --symbol "$SYMBOL" \
              --direction "$DIRECTION" \
              --market "$MARKET" \
              --price "$PRICE" \
              --date "$EXIT_DATE" \
              --journal-type "$JOURNAL_TYPE"
          fi

      # Track-record integrity gate (Phase 4): a close that somehow left the
      # book malformed/stale must fail HERE, before anything is committed.
      - name: Verify book integrity
        run: python -m scanner.broker.vivek_run --verify

      - name: Commit updated journal
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          DIRECTION: ${{ github.event.inputs.direction }}
          PRICE: ${{ github.event.inputs.price }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Surgical paths (review C3): only the files a close can write —
          # never the whole public/data directory. ONE path per git add
          # (2026-07-20 hotfix): a single missing pathspec — e.g. the
          # unassigned book file, which only exists when migration found
          # strays — makes a combined `git add` stage NOTHING, silently.
          for p in journal/vivek_bot_book.json journal/vivek_bot_book.asx.json \
                   journal/vivek_bot_book.nasdaq.json journal/vivek_bot_book.crypto.json \
                   journal/vivek_bot_book.unassigned.json public/data/vivek_bot_book.json \
                   journal/journal.json journal/scalp_journal.json \
                   public/data/journal.json public/data/scalp_journal.json; do
            git add -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit (position not found or already closed)."
          else
            git commit -m "journal: manual close $SYMBOL $DIRECTION @ $PRICE"
            git pull --rebase origin main
            git push
          fi
