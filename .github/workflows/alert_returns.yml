# Confluence forward returns (2026-08-20) — the measurement the headline
# feature never had.
#
# Runs scripts/alert_returns.py daily: ingests new multi-lens alignments from
# the ALERTS log into the durable ledger data/alert_forward_returns.json and
# stamps 5/10/20-session forward returns as each horizon matures. Research
# only — nothing reads the ledger back into any signal path (pinned by
# tests/test_alert_returns.py), and this job never writes alert_history.json
# (that file belongs to the scan mutex; see the script's header for why the
# ledger is a separate file at all).
#
# NOT in the `scan` concurrency group: it writes ONLY its own ledger, which no
# other workflow touches, and queueing a daily job in the one-pending-slot
# scan group is how the :47 backstop got evicted (2026-07-28). The commit step
# is the reco_note.yml pattern verbatim: skip when the script printed
# ALERT_RETURNS_UNCHANGED (a quiet day is a legitimate no-op — exactly where
# a must-change gate would be wrong), surgical single-path staging with
# assert_staged when a change WAS claimed, and the reset-and-retry push loop
# that folds in anything main grew mid-run.
#
# 22:20 UTC: after NASDAQ close data (21:07 scan) and clear of the 21:00
# evidence brief and 21:35 backup crons. Watchdogged at 26h like the other
# daily writers (config.WATCHDOG_RUNS).

name: Alert forward returns

on:
  schedule:
    - cron: "20 22 * * *"
    # BACKSTOP (2026-08-27): on 2026-08-26 the scheduler dropped the 22:20
    # firing ENTIRELY — no run of any conclusion — in the same 21:00–23:00
    # window that dropped backup_book's cron and delayed evidence_brief 3h
    # (same class as the documented 2026-07-24 / 2026-07-30 drops). The gate
    # step skips this cron when a pass has already LANDED on main since this
    # slot opened (22:00 UTC), so a healthy scheduler costs no extra Yahoo walk
    # and a ghosted 22:20 is healed the same night instead of leaving the
    # ledgers a day stale.
    - cron: "50 23 * * *"
  workflow_dispatch: {}

permissions:
  # No `actions: read` (2026-10-05): the backstop gate reads the ledgers on
  # main, not the Actions API -- the gate step says why.
  contents: write

jobs:
  returns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The backstop cron's freshness gate: has a pass LANDED ON MAIN since
      # this backstop's slot opened? The slot is the most recent 22:00 UTC
      # (the primary fires 22:20), NOT the UTC calendar date: the scheduler
      # runs both crons hours late, so the previous slot's runs land after
      # 00:00 UTC, and a calendar-date check paired an on-time 23:50 with
      # YESTERDAY's late runs and skipped a day whose 22:20 never ran
      # (2026-10-05 audit). The evidence is the ledgers' own updated_at on a
      # FRESH fetch of main (a run that sat queued was created at an older
      # SHA). Only a pass that did the work AND pushed can write it, so a
      # backstop skip-run, or a run that failed before its push, can never
      # count as a pass -- both read as "scheduled success" to the Actions API.
      # Fail-OPEN: an unreadable ledger reads as "no pass yet" and the backstop
      # runs. Every script below is idempotent and the commit step skips on
      # the *_UNCHANGED sentinels, so a redundant pass costs minutes (the one
      # case this cannot see: a pass that legitimately changed nothing), while
      # a skipped needed pass is the exact hole the backstop exists to close.
      - id: gate
        name: Backstop freshness gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${SCHEDULE:-}" != "50 23 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW=$(date -u +%s)
          SLOT=$(( NOW - (NOW - 22 * 3600) % 86400 ))   # the most recent 22:00 UTC
          git fetch --quiet --depth=1 origin main || true
          LANDED=0
          for p in data/alert_forward_returns.json data/edge_rosters.json; do
            T=$(git show "origin/main:$p" 2>/dev/null \
              | python3 -c "import datetime as d,json,sys; print(int(d.datetime.fromisoformat(json.load(sys.stdin)['updated_at']).timestamp()))" 2>/dev/null) || T=0
            if [ "${T:-0}" -gt "$LANDED" ] 2>/dev/null; then LANDED=$T; fi
          done
          SEEN=never
          if [ "$LANDED" -gt 0 ]; then SEEN=$(date -u -d "@$LANDED" '+%Y-%m-%d %H:%M UTC'); fi
          echo "backstop 23:50 - slot opened $(date -u -d "@$SLOT" '+%Y-%m-%d %H:%M UTC'); newest ledger write on main: $SEEN"
          if [ "$LANDED" -ge "$SLOT" ]; then
            echo "A pass already landed on main since the 22:00 UTC slot opened. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Needs the pinned yfinance stack — the script prices through
      # scanner.data.download, the same access the scanner itself uses.
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Ingest + stamp forward returns
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python scripts/alert_returns.py 2>&1 | tee /tmp/alert_returns_out.txt

      # The single-lens BASELINE cohort (batch-100 WS-B): today's A+ rosters,
      # stamped by the same imported machinery on the same Yahoo plumbing —
      # so "does alignment beat plain A+" keeps answering itself.
      - name: Build the A+ roster baseline
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python scripts/edge_rosters.py 2>&1 | tee /tmp/edge_rosters_out.txt

      # Tide transparency (batch-100 WS-D): how much of the open book's
      # unrealized R survives a uniform pullback, against the REAL stops.
      # Published for the journal's quiet tide line.
      - name: Book stress report
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python scripts/book_stress.py 2>&1 | tee /tmp/book_stress_out.txt

      # The daily research digest (batch-100 WS-J): the edge report's ledger
      # view lands on the run page every day, no local checkout needed.
      - name: Edge report to step summary
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python scripts/alert_edge_report.py 2>&1 | tee /tmp/edge_report_out.txt
          {
            echo '```'
            cat /tmp/edge_report_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Machine-readable headline (batch-100 WS-J): the dedup aligned-vs-A+
      # numbers as a small committed artefact, built from the report's OWN
      # stat functions — diffable day over day in git.
      - name: Edge summary artefact
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python scripts/edge_summary.py 2>&1 | tee /tmp/edge_summary_out.txt

      - name: Commit & push (surgical — the edge artefacts only)
        if: steps.gate.outputs.run == 'true'
        run: |
          if grep -q ALERT_RETURNS_UNCHANGED /tmp/alert_returns_out.txt \
             && grep -q EDGE_ROSTERS_UNCHANGED /tmp/edge_rosters_out.txt \
             && grep -q BOOK_STRESS_UNCHANGED /tmp/book_stress_out.txt \
             && grep -q EDGE_SUMMARY_UNCHANGED /tmp/edge_summary_out.txt; then
            echo "Nothing new in any artefact - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/alert_forward_returns.json
          # || true pairing (allowed because assert_staged gates below): on a
          # run where the roster script had nothing to write the file may not
          # exist yet, and a missing pathspec exits 128 under bash -e.
          git add -- data/edge_rosters.json 2>/dev/null || true
          git add -- public/data/book_stress.json 2>/dev/null || true
          git add -- public/data/edge_summary.json 2>/dev/null || true
          # Must-change gate (ANY-OF across the artefacts): reaching here
          # means at least one script CLAIMED a change, so staging nothing is
          # always a bug.
          bash scripts/assert_staged.sh "edge ledgers" data/alert_forward_returns.json data/edge_rosters.json public/data/book_stress.json public/data/edge_summary.json
          git commit -m "data: edge ledgers $(date -u +'%Y-%m-%d')"
          SHA=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git checkout "$SHA" -- data/alert_forward_returns.json
            git checkout "$SHA" -- data/edge_rosters.json 2>/dev/null || true
            git checkout "$SHA" -- public/data/book_stress.json 2>/dev/null || true
            git checkout "$SHA" -- public/data/edge_summary.json 2>/dev/null || true
            git add -- data/alert_forward_returns.json
            git add -- data/edge_rosters.json 2>/dev/null || true
            git add -- public/data/book_stress.json 2>/dev/null || true
            git add -- public/data/edge_summary.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: edge ledgers $(date -u +'%Y-%m-%d')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race - retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1
