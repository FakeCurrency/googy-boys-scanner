name: Confluence alert (post-nightly)

# Multi-lens confluence -> Discord ping, 15 min after the PhaseMap/Specs
# nightly lands (2026-07-20, review H6). This workflow exists so the
# confluence dedupe state (journal/confluence_state.json +
# public/data/phasemap/alert_history.json) has a SINGLE committing owner:
# the "scan" concurrency group. Previously phasemap.yml (its own group)
# also ran confluence and committed the state, so the two groups could
# revert each other's dedupe keys — duplicate @here pings or silenced
# alerts. Intraday confluence still runs inside scan.yml after every scan;
# this run only picks up alignments created by the nightly data refresh.

on:
  # SCHEDULE RE-REGISTRATION (2026-07-30): the scheduler stopped creating runs
  # for EVERY cron in this repo after ~01:15 UTC — the same window in which
  # GitHub's ref backend was erroring (crypto_bot #255, "fatal error in
  # commit_refs"). This touch re-registers all schedules (2026-07-24 precedent).
  schedule:
    - cron: "45 8 * * *"     # daily, 15 min after phasemap.yml's 08:30 UTC
  workflow_dispatch:

permissions:
  contents: write

# Same group as scan.yml / crypto_bot.yml / close_position.yml — every
# committer of the confluence state serializes here (the C1 invariant).
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  confluence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confluence Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GBS_SYNC_CODE: ${{ secrets.GBS_SYNC_CODE }}
        run: python -m scanner.confluence_alert

      - name: Commit state (surgical — the two confluence files only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS="journal/confluence_state.json public/data/phasemap/alert_history.json"
          # TOP100 #52 (2026-07-28) — `git add a b` is ALL-OR-NOTHING. With one
          # path missing it exits 128 with "pathspec did not match any files"
          # and stages NEITHER — verified, not assumed. `2>/dev/null || true`
          # then swallowed both the message and the status, so the very next
          # line found an empty index and printed "No state changes to commit"
          # before exiting 0. That sentence is also the TRUE and common
          # outcome here (most nights produce no new alignment), so the failure
          # was wearing the normal case as a disguise — this workflow exists to
          # be the SINGLE committing owner of the dedupe state, and it would
          # have gone on reporting success while quietly owning nothing.
          # Staged one at a time so a missing sibling cannot veto the file that
          # is there, and the absence is said out loud instead of hidden.
          for p in $PATHS; do
            if [ -e "$p" ]; then
              git add -- "$p"
            else
              echo "::warning::$p is not present - nothing to stage for it"
            fi
          done
          # The invariant, and the reason this is not an assert_staged call:
          # "something changed" is the wrong question, because a quiet night is
          # legitimate and gating on it would fail most runs. The right one is
          # "did anything change and NOT get staged" — after the adds above,
          # any remaining unstaged diff in these paths is a staging bug by
          # construction, and it is silent on a night with nothing to say.
          if ! git diff --quiet -- $PATHS; then
            echo "::error::confluence state changed but did not stage:"
            git diff --name-only -- $PATHS
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "data: confluence $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              # TOP100 #42 — only ever REPLACE a path this run actually
              # generated. The old form ran `git rm` unconditionally and then
              # let the checkout fail silently into `|| true`, so any path
              # present on the freshly-fetched main but ABSENT from $SHA was
              # deleted, staged by the `git add -A` below, and pushed. Nothing
              # in the loop could tell that apart from an intentional delete.
              # It is not hypothetical: several listed paths exist only
              # sometimes (the unassigned book is written only when migration
              # finds strays), and every workflow in the scan group re-applies
              # its own list on top of a main that a sibling may have just
              # written — so the loop written to survive a push race could
              # lose one instead. If $SHA does not have it, this run did not
              # generate it, so main's copy is the newer one: leave it.
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: confluence $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push race — retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1
