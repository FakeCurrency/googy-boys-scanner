name: VIVEK backtest

# Walk-forward backtest of the VIVEK 5.0 strategy (replays the real engine over
# history). Heavy + data-hungry, so it runs in CI where Yahoo is reachable.
#
# STREAMING: each market is backtested and committed separately (merging into
# public/data/vivek_backtest.json), so results land one market at a time —
# status="partial" until the last market flips it to "complete".
on:
  # Monthly evidence refresh (1st of the month, 08:00 UTC): re-runs the
  # LONG-ONLY walk-forward so the edge estimate stays current instead of
  # ossifying at a single snapshot.
  #
  # OWNERSHIP (consolidated 2026-07-09): this workflow writes ONLY
  # vivek_backtest_longonly.json. The canonical both-directions file
  # (public/data/vivek_backtest.json — what the Insights page quotes) is
  # owned by the WEEKLY lens_backtest.yml. Previously a manual dispatch here
  # with default inputs silently overwrote the weekly file with a different
  # methodology (10y both-directions vs weekly 5y).
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max symbols per market (0 = all; bigger = slower)"
        default: "60"
      period:
        description: "History depth (e.g. 10y, max)"
        default: "10y"

permissions:
  contents: write

concurrency:
  group: vivek-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stream backtest per market (commit after each)
        run: |
          set -e
          LIM="${{ github.event.inputs.limit }}"; LIM="${LIM:-60}"
          PER="${{ github.event.inputs.period }}"; PER="${PER:-10y}"
          # ALWAYS long-only, ALWAYS the longonly file — the canonical
          # both-directions vivek_backtest.json belongs to lens_backtest.yml.
          OUT="public/data/vivek_backtest_longonly.json"; FLAG="--long-only"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_push() {
            git add "$OUT" 2>/dev/null || true
            if git diff --cached --quiet; then echo "no change"; return; fi
            git commit -m "data: VIVEK backtest${FLAG:+ (long-only)} [$1] $(date -u +'%Y-%m-%d %H:%M UTC')"
            SHA=$(git rev-parse HEAD)
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              git checkout "$SHA" -- "$OUT" 2>/dev/null || true
              git add -A
              if git diff --cached --quiet; then echo "nothing vs main"; return; fi
              git commit -m "data: VIVEK backtest${FLAG:+ (long-only)} [$1] $(date -u +'%Y-%m-%d %H:%M UTC')"
              if git push origin HEAD:main; then echo "pushed $1"; return; fi
              echo "push race — retry $i"; sleep $((i * 3))
            done
          }

          # NASDAQ first (mature 10y history → a meaningful first read fastest),
          # then ASX (the bulk), then Crypto (flips status to complete).
          python -m scanner.vivek_backtest --market nasdaq --limit "$LIM" --period "$PER" $FLAG --out "$OUT" --merge --status partial
          commit_push nasdaq
          python -m scanner.vivek_backtest --market asx --limit "$LIM" --period "$PER" $FLAG --out "$OUT" --merge --status partial
          commit_push asx
          python -m scanner.vivek_backtest --market crypto --limit "$LIM" --period "$PER" $FLAG --out "$OUT" --merge --status complete
          commit_push crypto
