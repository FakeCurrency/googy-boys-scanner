name: VIVEK backtest

# Walk-forward backtest of the VIVEK 5.0 strategy (replays the real engine over
# history). Heavy + data-hungry, so it runs in CI where Yahoo is reachable.
#
# STREAMING: each market is backtested and committed separately (merging into
# public/data/vivek_backtest.json), so results land one market at a time —
# status="partial" until the last market flips it to "complete".
on:
  # Monthly evidence refresh (1st of the month, 08:00 UTC): re-runs the
  # LONG-ONLY walk-forward so the edge estimate stays current instead of
  # ossifying at a single snapshot.
  #
  # OWNERSHIP (consolidated 2026-07-09): this workflow writes ONLY
  # vivek_backtest_longonly.json. The canonical both-directions file
  # (public/data/vivek_backtest.json — what the Insights page quotes) is
  # owned by the WEEKLY lens_backtest.yml. Previously a manual dispatch here
  # with default inputs silently overwrote the weekly file with a different
  # methodology (10y both-directions vs weekly 5y).
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max symbols per market (0 = all; bigger = slower)"
        default: "60"
      period:
        description: "History depth (e.g. 10y, max)"
        default: "10y"

permissions:
  contents: write

concurrency:
  group: vivek-backtest
  # TOP100 #43 — was `true`. This job commits after EACH market with
  # `--status partial` and only the crypto leg flips it to `complete`, so
  # cancelling a run mid-flight strands `vivek_backtest_longonly.json` at
  # partial: a published record that looks finished to anything reading the
  # file and is missing two markets. The run is monthly and takes up to 90
  # minutes; there is no stampede to protect against, and letting the first
  # one finish is strictly better than leaving the artefact half-written.
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stream backtest per market (commit after each)
        env:
          # Free-text inputs via env, never ${{ }} in run: (2026-07-20 security pass)
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_PERIOD: ${{ github.event.inputs.period }}
        run: |
          set -e
          LIM="${IN_LIMIT:-60}"
          PER="${IN_PERIOD:-10y}"
          # ALWAYS long-only, ALWAYS the longonly file — the canonical
          # both-directions vivek_backtest.json belongs to lens_backtest.yml.
          OUT="public/data/vivek_backtest_longonly.json"; FLAG="--long-only"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_push() {
            # TOP100 #52/#54 follow-on (2026-07-28) — the `2>/dev/null || true`
            # here bought nothing and cost the only signal: $OUT is a single
            # TRACKED path, so `git add` on it cannot fail on a checked-out
            # tree, and if it ever did the swallowed status would fall straight
            # through to the "no change" line below and return GREEN. This is
            # the workflow that already shipped one silent-green failure (#43,
            # see the note at the bottom of this loop); it does not need a
            # second route to the same outcome.
            git add -- "$OUT"
            if git diff --cached --quiet; then echo "no change"; return; fi
            git commit -m "data: VIVEK backtest${FLAG:+ (long-only)} [$1] $(date -u +'%Y-%m-%d %H:%M UTC')"
            SHA=$(git rev-parse HEAD)
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              git checkout "$SHA" -- "$OUT" 2>/dev/null || true
              git add -A
              if git diff --cached --quiet; then echo "nothing vs main"; return; fi
              git commit -m "data: VIVEK backtest${FLAG:+ (long-only)} [$1] $(date -u +'%Y-%m-%d %H:%M UTC')"
              if git push origin HEAD:main; then echo "pushed $1"; return; fi
              echo "push race — retry $i"; sleep $((i * 3))
            done
            # TOP100 #43 — falling out of the retry loop used to return 0, so a
            # run that failed to push all five times finished GREEN with the
            # result only in a deleted runner's filesystem. Every sibling
            # workflow ends its loop with `exit 1`; this one silently did not,
            # which made it the one backtest whose disappearance looked like
            # "no change this week". `set -e` is on, so returning 1 aborts the
            # step at the market that failed rather than running the remaining
            # markets against a tree that could not be published.
            echo "Could not push [$1] after retries"; return 1
          }

          # NASDAQ first (mature 10y history → a meaningful first read fastest),
          # then ASX (the bulk), then Crypto (flips status to complete).
          python -m scanner.vivek_backtest --market nasdaq --limit "$LIM" --period "$PER" $FLAG --out "$OUT" --merge --status partial
          commit_push nasdaq
          python -m scanner.vivek_backtest --market asx --limit "$LIM" --period "$PER" $FLAG --out "$OUT" --merge --status partial
          commit_push asx
          python -m scanner.vivek_backtest --market crypto --limit "$LIM" --period "$PER" $FLAG --out "$OUT" --merge --status complete
          commit_push crypto
