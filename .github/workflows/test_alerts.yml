name: Alert-path self-test

# Manual-only (2026-07-21, Phase 6 P2): proves the alert channels DELIVER by
# forcing one test message through every configured route (Telegram,
# email) via `scanner.watchdog --test-alert`, running where the real secrets
# live. An unexercised email path is a CRITICAL that silently degrades to
# a single channel — run this once after ANY alert-secret change and read the
# per-channel result in the job summary. It sends real (clearly-labelled)
# test messages, so it has NO schedule and never runs automatically.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alert-self-test
  cancel-in-progress: false

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test alert through every configured channel
        env:
          WATCHDOG_HOST: self-test
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GBS_SMTP_HOST: ${{ secrets.GBS_SMTP_HOST }}
          GBS_SMTP_PORT: ${{ secrets.GBS_SMTP_PORT }}
          GBS_SMTP_USER: ${{ secrets.GBS_SMTP_USER }}
          GBS_SMTP_PASS: ${{ secrets.GBS_SMTP_PASS }}
          GBS_ALERT_TO: ${{ secrets.GBS_ALERT_TO }}
          GBS_ALERT_FROM: ${{ secrets.GBS_ALERT_FROM }}
        run: |
          # TOP100 #51 (2026-07-28) — `a | tee b` exits with TEE's status, and
          # tee succeeds essentially always. GitHub's default shell is
          # `bash -e {0}`: -e is on, pipefail is NOT. So a watchdog that threw
          # left THIS job green — the one job whose entire purpose is to prove
          # the alert path works before you trust it, reporting success about a
          # self-test that crashed. The summary underneath then printed an
          # empty code block under the words "the test ran", which is worse
          # than no summary because it reads as "no routes configured".
          #
          # pipefail alone would fail the step BEFORE the summary is written,
          # losing the output at exactly the moment it is worth most. So the
          # status is captured, the summary is always written, and the step
          # exits with the real code at the end. 2>&1 puts the traceback in the
          # summary too, since stderr is where the reason lives and the raw log
          # is not what this workflow tells you to read.
          set -o pipefail
          rc=0
          python -m scanner.watchdog --test-alert 2>&1 | tee /tmp/alert_test.txt || rc=$?
          {
            echo "## Alert-path self-test"
            echo ""
            if [ "$rc" -ne 0 ]; then
              echo "> **THE SELF-TEST ITSELF FAILED (exit $rc).** Nothing below"
              echo "> can be read as evidence that a channel works — the run"
              echo "> did not get far enough to find out. The traceback is in"
              echo "> the block."
            else
              echo "Green job = the test ran; **read the lines below** for what"
              echo "actually delivered. Any route listed as NOT delivered means"
              echo "that channel is unconfigured or failing — a CRITICAL would"
              echo "silently skip it."
            fi
            echo ""
            echo '```'
            cat /tmp/alert_test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
