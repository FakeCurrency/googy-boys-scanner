name: Momentum scan

# VIVEK MOMENTUM -- the divergence lens. REPORT-ONLY: it publishes
# public/data/momentum/<market>.json and touches nothing else, ever.
#
# ONE MARKET PER RUN, AFTER THAT MARKET'S CLOSE. Spec 5.11 is explicit that a
# daily screener must NOT run during market hours: a forming bar's RSI and EMA
# move all session, so an intraday run produces a signal that may not exist at
# the close, and the screen does not drop a forming bar itself.
#
# WHICH MARKET IS DECIDED BY THE DATA, NOT BY WHICH CRON FIRED (2026-09-23).
# This used to map three crons to three markets. On 2026-09-23 GitHub's
# scheduler created almost no scheduled runs repo-wide between ~06:46 and
# ~09:53 UTC, the 06:30 ASX event was never delivered, and a dropped cron
# leaves no run and nothing to retry. So every wake-up now runs
# scripts/momentum_due.py against the files AS COMMITTED ON MAIN: a market is
# due when its generated_at predates the close it owes (local close + 30 min,
# weekdays; crypto 00:30 UTC daily) AND its next session has not opened. The
# newest-due market is screened; if nothing is due the run stops before
# `pip install`. The DST arithmetic lives in the gate, in each market's own
# timezone -- never hard-code the offset you happen to be in.
#
# THE WAKE-UPS, deliberately redundant because any one of them can be dropped:
#   * the three original crons, unchanged, plus a backstop every three hours;
#   * every completed morning_plays.yml run. Those are dispatched by the
#     cron-job.org pinger every 30 minutes after each close (06:15-10:45 and
#     20:15-23:45 UTC, Mon-Fri), i.e. by a scheduler that is NOT GitHub's,
#     which is the only kind that kept firing on 2026-09-23.
# A late or duplicate wake-up is harmless: the gate finds the file fresh.
#
# ITS OWN CONCURRENCY GROUP, and that is enforced, not merely advised: joining
# `group: scan` would make this a member of the paper-book mutex, and
# tests/test_workflow_mutex.py would then require it in close_position.yml's
# wait-loop watch list. It writes no book, so it has no business in that queue.

on:
  schedule:
    - cron: "30 6 * * 1-5"    # after the Sydney close (AEST and AEDT)
    - cron: "30 21 * * 1-5"   # after the New York close (EST and EDT)
    - cron: "30 0 * * *"      # just past the UTC day boundary; 7 days
    - cron: "41 */3 * * *"    # backstop; odd minute, away from the :00 pile-up
  workflow_run:
    workflows: ["Morning plays (Discord)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      market:
        description: "Market to screen"
        default: "asx"
        required: false
        type: choice
        options: ["asx", "nasdaq", "crypto"]
      mode:
        description: "A = divergence only (default) | B = A or B | C = both, aligned"
        default: "A"
        required: false
        type: choice
        options: ["A", "B", "C"]
      window:
        description: "Freshness in BARS for both rules (blank = config default, 1)"
        default: ""
        required: false
      dry_run:
        description: "Screen and print the summary, publish nothing"
        default: false
        required: false
        type: boolean
      backtest:
        description: "Replay the lens over 5y and publish <market>_backtest.json instead of screening"
        default: false
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  momentum:
    runs-on: ubuntu-latest
    # One market, but ASX is ~2,000 names and the download is the slow part.
    # Bounded because an unbounded job holds a runner for six hours and, holding
    # this group, stalls every later Momentum refresh rather than just itself.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # THE GATE. A manual dispatch screens the market it names, no questions.
      # Every automatic wake-up asks scripts/momentum_due.py instead, reading
      # the files from a FRESH fetch of main -- a run that sat pending behind
      # the previous one was created at an older SHA, and that older copy
      # would call a market due that was published minutes ago. Stdlib only
      # on the runner's own python3, so a no-op wake-up never installs pandas.
      - name: Which market is due
        id: due
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKET="${{ inputs.market }}"
            echo "market=${MARKET:-asx}" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: ${MARKET:-asx} (no due check)"
            exit 0
          fi
          git fetch --quiet --depth=1 origin main
          STAMPS="$RUNNER_TEMP/momentum-on-main"
          mkdir -p "$STAMPS"
          for m in asx nasdaq crypto; do
            git show "origin/main:public/data/momentum/$m.json" > "$STAMPS/$m.json" 2>/dev/null \
              || rm -f "$STAMPS/$m.json"
          done
          echo "wake-up: ${{ github.event_name }}"
          python3 scripts/momentum_due.py --dir "$STAMPS" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.market != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.due.outputs.market != ''
        run: pip install -r requirements.txt

      # Its OWN cache namespace. Sharing `vivek-frames-` would mix a 3y window
      # with the scan's 5y one under the same keys, and a separate namespace is
      # one more thing that disappears cleanly when the lens does.
      - name: Restore frame cache
        if: steps.due.outputs.market != ''
        uses: actions/cache@v4
        with:
          path: .cache/frames
          key: momentum-frames-${{ github.run_id }}
          restore-keys: |
            momentum-frames-

      - name: Screen the market
        id: scan
        if: steps.due.outputs.market != ''
        run: |
          set -u
          MARKET="${{ steps.due.outputs.market }}"
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"

          ARGS="--market $MARKET"
          if [ -n "${{ inputs.mode }}" ]; then ARGS="$ARGS --mode ${{ inputs.mode }}"; fi
          if [ -n "${{ inputs.window }}" ]; then ARGS="$ARGS --window ${{ inputs.window }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # A manual BACKTEST publishes the lens's second file, same directory,
          # same gate and commit path; an automatic wake-up never sets this.
          FILE="$MARKET.json"
          if [ "${{ inputs.backtest }}" = "true" ]; then
            ARGS="$ARGS --backtest"
            FILE="${MARKET}_backtest.json"
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

          # THREE OUTCOMES, AND THE EXIT CODE IS WHAT TELLS THEM APART.
          #   0  screened and published
          #   3  deliberately published nothing (download blocked/empty); the
          #      previous file stands, which is the whole point -- publishing an
          #      empty results list over it would make the page say "nothing set
          #      up today" when the truth is "we could not look"
          #   *  a real failure
          # `|| RC=$?` neutralises the STATUS without appending to the OUTPUT,
          # which is the distinction from the `|| echo` form that caused the
          # "000000" bug in the old stop-watcher.
          RC=0
          python -m scanner.momentum.run $ARGS || RC=$?
          echo "rc=$RC"
          case "$RC" in
            0)
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::momentum $MARKET published nothing - the download came back empty and the previous file was kept. This is a REPORTED DECISION, not a fault; the watchdog for it is the next run."
              ;;
            *)
              echo "::error::momentum $MARKET failed with exit $RC"
              exit "$RC"
              ;;
          esac

      - name: Commit and push
        if: steps.scan.outputs.published == 'true' && inputs.dry_run != true
        run: |
          set -u
          MARKET="${{ steps.scan.outputs.market }}"
          FILE="${{ steps.scan.outputs.file }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ONE path, and one pathspec per `git add`. `git add a b` is
          # ALL-OR-NOTHING -- with one missing it exits 128 and stages NEITHER
          # -- so the repo bans the shape outright, and the loop form keeps
          # this honest if the list ever grows.
          PATHS="public/data/momentum/$FILE"
          for p in $PATHS; do
            if [ -e "$p" ]; then
              git add -- "$p"
            else
              echo "::warning::$p is not present - nothing to stage for it"
            fi
          done

          # The must-change gate. Reached ONLY when the scanner reported a real
          # publish, so an empty index here means output was silently lost --
          # which is the 2026-07-20 incident this gate exists for. The
          # deliberate no-publish path never gets here, so the gate is never
          # asked a question it cannot answer.
          bash scripts/assert_staged.sh "momentum $MARKET" "public/data/momentum/$FILE"

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: momentum ${FILE%.json} $(date -u +'%Y-%m-%d %H:%M UTC')"
          SHA=$(git rev-parse HEAD)

          # Rebase-and-retry. Generated data is fully recomputed each run, so
          # the latest scan wins -- but only ever REPLACE a path THIS run
          # generated, or a sibling's newer copy gets deleted and pushed.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for p in $PATHS; do
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs main."; exit 0; fi
            git commit -m "data: momentum ${FILE%.json} $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push race - retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1
