# Decision replay -- the READ-ONLY evidence pack behind the bot's live rule
# (REFINE200 #5 / #32, 2026-10-14). It answers the owner's open questions
# about hc4-1 (A/A+ grade_raw, the four cells, the weekly/3d level gate, the
# 28-day time stop, $2,500 x 60): drop ASX or only ASX's 3D reclaim, a kill
# threshold on 3D reclaim, A+ only vs A/A+, weekly level only, and what the
# time stop is worth -- every variant re-run as a whole chronological book
# (scanner/vivek_parity.py), by market, by cell, by grade.
#
# It runs `python -m scanner.vivek_backtest --parity` and delivers TWO things:
# the decision tables in the step summary AND the log (a cloud session reads
# logs, not artifacts), and the full JSON report (+ the run log) as a 90-day
# artifact; then the live-vs-replay trade-by-trade study (2 Nov). The replay
# job COMMITS NOTHING: contents: read, no git writes, so no assert_staged
# and no WATCHDOG_RUNS entry (evidence_brief / crypto_source_check pattern),
# and its own concurrency group -- the `scan` group serialises book writers
# and this writes no book. The report goes to $RUNNER_TEMP, never
# public/data; the job's last step fails the run if anything under
# public/data changed anyway.
#
# NEXT100 #14 (3 Nov 2026): the replay also writes a SLIM summary (schema 1,
# scripts/decision_pack.py's docstring: the live-rules arm's taken trades,
# each variant's verdict and R/slot-month, the run's SHA and params) plus its
# pinned INPUTS (per name: first/last bar, bar count, a digest of the closes),
# so a later run can tell whether the rules or the data moved a verdict and
# the pack can read the same-weeks figure without the 90-day artifact. The
# second job, commit-summary, downloads that small artifact and commits the
# two files under data/research/decision_replay/ on the branch the replay ran
# on. It is the ONLY job with contents: write; it writes no book, so it has
# its own concurrency group (not `scan`) and, like momentum / ignition, no
# WATCHDOG_RUNS entry: it only ever follows a replay, which has no clock.
#
# RUNTIME. Nearly all of it is vivek.evaluate on every candidate bar (~50-65 ms
# each, measured; ~400 per name over 5y, ~2x that over 10y), split across the
# runner's cores (--workers 0 = every CPU). Defaults 300 names/market x 5y:
# ~300k engine calls = ~4.6 CPU-hours, ~70 min on a 4-vCPU runner, ~2.5 h on
# 2 vCPUs. 600 x 10y is ~17 CPU-hours (~4+ h even on 4 vCPUs) and does not fit
# the 330-minute budget; 600 x 5y fits on 4 vCPUs only. limit 0 = every name.
#
# Triggers: a manual dispatch, or a push touching .github/replay-kick on any
# branch (a cloud session can push but cannot call the dispatch API).

name: Decision replay

on:
  push:
    paths:
      - ".github/replay-kick"
  workflow_dispatch:
    inputs:
      limit:
        description: "Names sampled per market (0 = the whole universe; bigger = slower)"
        default: "300"
      period:
        description: "History depth (e.g. 5y; 10y roughly doubles the runtime)"
        default: "5y"
      markets:
        description: "all, asx, nasdaq or crypto"
        default: "all"

permissions:
  contents: read

concurrency:
  group: decision-replay-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Replay the live rules and the decision variants (writes nothing to the repo)
        env:
          # Free-text inputs via env, never ${{ }} in run: (2026-07-20 security pass)
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_PERIOD: ${{ github.event.inputs.period }}
          IN_MARKETS: ${{ github.event.inputs.markets }}
        run: |
          set -o pipefail
          LIM="${IN_LIMIT:-300}"
          PER="${IN_PERIOD:-5y}"
          MKT="${IN_MARKETS:-all}"
          case "$LIM" in ''|*[!0-9]*) echo "::error::limit must be a whole number, got '$LIM'"; exit 2;; esac
          case "$PER" in ''|*[!0-9a-z]*) echo "::error::period must look like 5y / 10y / max, got '$PER'"; exit 2;; esac
          case "$MKT" in all|asx|nasdaq|crypto) ;; *) echo "::error::markets must be all/asx/nasdaq/crypto, got '$MKT'"; exit 2;; esac
          OUT="$RUNNER_TEMP/decision-replay"
          mkdir -p "$OUT"
          # The report converts its secondary $ columns at the rate the scan
          # publishes (fx.json beside --out). Copied, never written back.
          cp public/data/fx.json "$OUT/fx.json" || echo "no fx.json: the report says FALLBACK rate"
          echo "limit=$LIM period=$PER markets=$MKT workers=$(nproc)"
          python -m scanner.vivek_backtest --parity --market "$MKT" --limit "$LIM" --period "$PER" \
            --tag decision_replay --workers 0 \
            --out "$OUT/decision_replay.json" --summary-md "$GITHUB_STEP_SUMMARY" \
            --summary-dir "$OUT/summary" \
            2>&1 | tee "$OUT/replay.log"

      # The owner's "20 more" #3 (2 Nov): every hc4-1 trade beside the replay's
      # trade on the same symbol -- where the live R went. Same rules, same
      # fetch path, unconstrained (no slot cap); reads the book, writes only to
      # RUNNER_TEMP and the step summary, and prints its tables to the log.
      - name: Live vs replay, trade by trade (hc4-1, read-only)
        if: success() || failure()
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/decision-replay"
          mkdir -p "$OUT"
          python -m scanner.live_vs_replay --cycle hc4-1 --period 5y \
            --out "$OUT/live_vs_replay.json" --summary-md "$GITHUB_STEP_SUMMARY" \
            2>&1 | tee "$OUT/live_vs_replay.log"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: decision-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/decision-replay/
          # 90 (2 Nov): the 14 Oct report expired before anyone could read
          # its by-cell row (a cloud session cannot download artifacts). The
          # replay now also prints every table into the job log.
          retention-days: 90
          if-no-files-found: warn

      # NEXT100 #14: the two small files the commit-summary job commits, as
      # their own artifact (the big report above is never committed). Only
      # on success: a failed replay has no verdict worth pinning.
      - name: Upload the slim summary for the commit job
        uses: actions/upload-artifact@v5
        with:
          name: decision-replay-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/decision-replay/summary/
          retention-days: 7
          if-no-files-found: error

      - name: Nothing under public/data moved
        if: always()
        run: |
          CHANGED="$(git status --porcelain -- public/data)"
          if [ -n "$CHANGED" ]; then
            echo "::error::the decision replay wrote under public/data -- it must write only to RUNNER_TEMP"
            echo "$CHANGED"
            exit 1
          fi
          echo "public/data untouched"

  # NEXT100 #14: commit the slim summary + pinned inputs on the branch the
  # replay ran on. NOT a book writer (nothing under journal/ or public/data),
  # so it stays out of the `scan` mutex; its own group serialises two replays
  # of the same branch. Only after a SUCCESSFUL replay (needs + success()).
  # The branch TIP is checked out (ref: github.ref), never the SHA the run
  # started on, so a queued commit never replays stale data over newer
  # writes; the push is momentum.yml's rebase-and-retry (one pathspec per
  # git add, fetch + reset + re-checkout of this run's paths), branch-aware.
  commit-summary:
    needs: replay
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: decision-replay-summary-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v5
        with:
          name: decision-replay-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/decision-replay-summary

      - name: Commit and push the decision replay summary
        run: |
          set -u
          set -o pipefail
          SRC="$RUNNER_TEMP/decision-replay-summary"
          DEST="data/research/decision_replay"
          for f in summary.json inputs.json; do
            if [ ! -s "$SRC/$f" ]; then
              echo "::error::$SRC/$f is missing or empty - the replay reported success without writing its summary"
              exit 1
            fi
          done
          # Exact: write_json's indent=1 prints `"schema": 1,` (a bare
          # '"schema": 1' would also pass a schema 10).
          if ! grep -q '"schema": 1,' "$SRC/summary.json"; then
            echo "::error::summary.json is not the schema-1 summary scripts/decision_pack.py reads"
            exit 1
          fi
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/summary.json"
          cp "$SRC/inputs.json" "$DEST/inputs.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"

          # ONE pathspec per `git add` (`git add a b` is all-or-nothing and
          # banned, tests/test_workflow_hardening.py).
          PATHS="$DEST/summary.json $DEST/inputs.json"
          for p in $PATHS; do
            git add -- "$p"
          done
          # The must-change gate, ANY-OF over the two files: every replay
          # re-stamps generated_at, so a summary that stages nothing means
          # the output was silently lost.
          bash scripts/assert_staged.sh "decision replay summary" "$DEST/summary.json" "$DEST/inputs.json"

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: decision replay summary $STAMP"
          SHA=$(git rev-parse HEAD)

          # Rebase-and-retry. Only ever REPLACE a path THIS run generated, or
          # a newer copy pushed meanwhile gets deleted.
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for p in $PATHS; do
              if git cat-file -e "$SHA:$p" 2>/dev/null; then
                git rm -rq --ignore-unmatch -- "$p" 2>/dev/null || true
                git checkout "$SHA" -- "$p"
              fi
            done
            git add -A
            if git diff --cached --quiet; then echo "Nothing new vs $BRANCH."; exit 0; fi
            git commit -m "data: decision replay summary $STAMP"
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed to $BRANCH."
              exit 0
            fi
            echo "Push race - retry $i"; sleep $((i * 3))
          done
          echo "Could not push after retries"; exit 1
