# Vivek 5.0 VPS kit -- installed by deploy/bin/install.sh as
# /etc/systemd/journald.conf.d/vivek5.conf (deploy/DESIGN.md 1, ops review).
#
# The scans are chatty (thousands of ticker lines per run, ~25 runs a day) and
# journald is persistent on Ubuntu with a default cap of 10% of the filesystem
# / 4 GB. Bound it explicitly so the journal can never crowd out the 2.4 GB
# clone and its growth. Per-unit burst dropping is disabled on the job units
# themselves (LogRateLimitIntervalSec=0 in every vivek5-*.service).
[Journal]
Storage=persistent
SystemMaxUse=2G
MaxRetentionSec=45day
